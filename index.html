    p.style.pointerEvents = 'none';

<!-- SCRIPT 1: CONTROL DEL MENÚ Y JUGADORES (2 A 4) -->
<script>
window.numJugadores = 2;

window.elegirJugadores = function(n) {
  if (n < 2) n = 2;
  if (n > 4) n = 4;
  window.numJugadores = n;
  try { localStorage.setItem('encadenadas_num_jug', String(n)); } catch (e) {}
  for (var i = 2; i <= 4; i++) {
    var btn = document.getElementById('btn-num-' + i);
    if (btn) {
      btn.className = (i === n)
        ? "bg-orange-600 text-white font-black py-2 rounded-xl border-2 border-[#5c3a21] shadow active:scale-95"
        : "bg-white text-slate-700 font-black py-2 rounded-xl border-2 border-orange-300 shadow active:scale-95";
    }
  }
  for (var j = 1; j <= 4; j++) {
    var inp = document.getElementById('input-nombre-' + j);
    if (inp) {
      if (j <= n) inp.classList.remove('hidden');
      else inp.classList.add('hidden');
    }
  }
  window.actualizarTextoBotones();
};

window.actualizarTextoBotones = function() {
  var inp1 = document.getElementById('input-nombre-1');
  var inp2 = document.getElementById('input-nombre-2');
  var n1 = (inp1 && inp1.value.trim()) ? inp1.value.trim() : "Jugador 1";
  var n2 = (inp2 && inp2.value.trim()) ? inp2.value.trim() : "Jugador 2";
  var tPve = document.getElementById('txt-pve');
  var tPvp = document.getElementById('txt-pvp');
  if (tPve) tPve.textContent = "👤 " + n1 + " vs 🤖 Máquina (RAE)";
  if (tPvp) {
    if (window.numJugadores === 2) {
      tPvp.textContent = "👤 " + n1 + " vs 👤 " + n2;
    } else {
      tPvp.textContent = "👥 Jugar " + window.numJugadores + " Jugadores";
    }
  }
};

window.cargarDatosMenu = function() {
  try {
    var rec = parseInt(localStorage.getItem('encadenadas_record') || '0', 10) || 0;
    document.getElementById('menu-record').textContent = rec;
    document.getElementById('record-palabras').textContent = rec;
    var guardados = parseInt(localStorage.getItem('encadenadas_num_jug') || '2', 10);
    if (guardados >= 2 && guardados <= 4) window.numJugadores = guardados;
    else window.numJugadores = 2;
    for (var i = 1; i <= 4; i++) {
      var clave = (i === 1) ? 'encadenadas_n1' : (i === 2) ? 'encadenadas_n2' : ('encadenadas_n' + i);
      var val = localStorage.getItem(clave) || "";
      var el = document.getElementById('input-nombre-' + i);
      if (el) el.value = val;
    }
  } catch (e) {}
  window.elegirJugadores(window.numJugadores);
};
window.cargarDatosMenu();
</script>

// ---------- Función silabaParaVoz(): lectura corrida sin deletrear y "tó" en español ----------
const FONETICA_SILABAS_VOZ = {
  'to': 'tó', 'do': 'dó', 'no': 'nó', 'so': 'só', 'go': 'gó', 'lo': 'ló',
  'po': 'pó', 'ro': 'ró', 'co': 'có', 'mo': 'mó', 'bo': 'bó', 'vo': 'vó',

  'tor': 'tór', 'por': 'pór', 'cor': 'cór', 'mor': 'mór', 'sor': 'sór',
  'lor': 'lór', 'for': 'fór', 'bor': 'bór', 'dor': 'dór', 'nor': 'nór',

  'dos': 'dós', 'nos': 'nós', 'vos': 'vós', 'sos': 'sós',
  'me': 'mé', 'te': 'té', 'se': 'sé', 'de': 'dé', 'le': 'lé', 'pe': 'pé',
  're': 'ré', 'ce': 'zé', 'fe': 'fé', 'ge': 'jé', 'je': 'jé', 've': 'vé',
  'be': 'bé', 'ne': 'né', 'que': 'ké', 'gue': 'gué', 'che': 'ché', 'lle': 'llé',
  'mi': 'mí', 'ti': 'tí', 'si': 'sí', 'di': 'dí', 'li': 'lí', 'pi': 'pí',
  'ri': 'rí', 'ci': 'zí', 'fi': 'fí', 'gi': 'jí', 'ji': 'jí', 'vi': 'ví',
  'bi': 'bí', 'ni': 'ní', 'qui': 'kí', 'gui': 'guí',
  'la': 'lá', 'pa': 'pá', 'ta': 'tá', 'sa': 'sá', 'ca': 'cá', 'ma': 'má',

  'tu': 'tú', 'su': 'sú', 'lu': 'lú', 'pu': 'pú', 'ru': 'rú', 'cu': 'cú',
  'mu': 'mú', 'bu': 'bú', 'vu': 'vú', 'fu': 'fú', 'gu': 'gú', 'ju': 'jú',
  'in': 'ín', 'on': 'ón', 'an': 'án', 'en': 'én', 'un': 'ún',

  'lon': 'lón', 'pon': 'pón', 'con': 'cón', 'son': 'són', 'ton': 'tón',
  'mon': 'món', 'ron': 'rón', 'don': 'dón', 'non': 'nón', 'bon': 'bón',
  'lan': 'lán', 'pan': 'pán', 'can': 'cán', 'san': 'sán', 'tan': 'tán',
  'man': 'mán', 'van': 'ván', 'dan': 'dán', 'gran': 'grán', 'plan': 'plán'
};

function silabaParaVoz(silaba) {
  let s = (silaba || "").toLowerCase().trim();
  if (!s) return "";
  if (FONETICA_SILABAS_VOZ[s]) return FONETICA_SILABAS_VOZ[s];
  if (/[áéíóú]/.test(s)) return s;

  s = s.replace(/^ge/, 'je').replace(/^gi/, 'ji').replace(/^que/, 'ke').replace(/^qui/, 'ki');

  const mapaTilde = { 'a': 'á', 'e': 'é', 'i': 'í', 'o': 'ó', 'u': 'ú' };
  const fuertes = ['a', 'e', 'o'];
  for (let i = s.length - 1; i >= 0; i--) {
    if (fuertes.includes(s[i])) {
      return s.slice(0, i) + mapaTilde[s[i]] + s.slice(i + 1);
    }
  }
  for (let i = s.length - 1; i >= 0; i--) {
    if (mapaTilde[s[i]]) {
      return s.slice(0, i) + mapaTilde[s[i]] + s.slice(i + 1);
    }
  }
  return s;
}

function actualizarMarcadoresUI() {
  spanContadorPalabras.textContent = contadorPalabras;

  spanMenuRecord.textContent = recordPalabras;

function incrementarContadorPalabras() {
  contadorPalabras++;

    recordPalabras = contadorPalabras;
    recordSuperadoEnPartida = true;
    try { localStorage.setItem('encadenadas_record', String(recordPalabras)); } catch (e) {}
  }
  actualizarMarcadoresUI();
}

// ---------- TRIPLE SISTEMA ANTIBLOQUEO DE PANTALLA (SIEMPRE ENCENDIDA) ----------
async function pedirWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        if (document.visibilityState === 'visible') {
          setTimeout(pedirWakeLock, 500);
        }
      });
    }
  } catch (e) { wakeLock = null; }

  // Si Capacitor KeepAwake está presente
  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) {
      window.Capacitor.Plugins.KeepAwake.keepAwake();
    }
  } catch (e) {}
}

// Vídeo invisible en bucle generado por Canvas: impide que Android/WebView apague la pantalla
function activarVideoNoSleep() {
  try {
    if (videoWakeLock) {
      if (videoWakeLock.paused) videoWakeLock.play().catch(() => {});
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 2;
    const ctx = canvas.getContext('2d');
    setInterval(() => {
      if (ctx) {
        ctx.fillStyle = (Date.now() % 2 === 0) ? '#000000' : '#010101';
        ctx.fillRect(0, 0, 2, 2);
      }
    }, 1000);

    if (typeof canvas.captureStream === 'function') {
      const v = document.createElement('video');
      v.setAttribute('playsinline', '');
      v.setAttribute('muted', '');
      v.muted = true;
      v.loop = true;
      v.style.position = 'fixed';
      v.style.top = '-10px';
      v.style.left = '-10px';
      v.style.width = '1px';
      v.style.height = '1px';
      v.style.opacity = '0.01';
      v.style.pointerEvents = 'none';
      v.srcObject = canvas.captureStream(1);
      document.body.appendChild(v);
      v.play().catch(() => {});
      videoWakeLock = v;
    }
  } catch (e) {}
}

function crearSilencio() {
  const n = 8000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b[44 + i] = 128 + (i % 2 ? 1 : -1);
  const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
  a.loop = true; a.volume = 0.02;
  return a;
}

function mantenerPantallaActivaTotal() {
  pedirWakeLock();
  activarVideoNoSleep();
  try {
    silencio = silencio || crearSilencio();
    if (silencio.paused) silencio.play().catch(() => {});
  } catch (e) {}
}

// Re-solicitar WakeLock en cualquier interacción del usuario y periódicamente
document.addEventListener('touchstart', mantenerPantallaActivaTotal, { passive: true });
document.addEventListener('click', mantenerPantallaActivaTotal, { passive: true });
setInterval(() => {
  if (document.visibilityState === 'visible') {
    pedirWakeLock();
    if (videoWakeLock && videoWakeLock.paused) {
      videoWakeLock.play().catch(() => {});
    }
  }
}, 4000);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    mantenerPantallaActivaTotal();
    try { window.speechSynthesis && window.speechSynthesis.resume(); } catch (e) {}
    if (micDeseado && !hablando && modoActual !== "") {
      setTimeout(arrancarRecon, 350);
    }
  }
});

function recortarSignificadoBreve(texto) {
  if (!texto) return "";
  let limpio = texto
    .replace(/\{\{plm\|([^}|]+)(?:\|[^}]*)?\}\}/gi, '$1')
    .replace(/\{\{(?:l\+|l|m|f|sinónimo|sinonimo)\|es\|([^}|]+)(?:\|[^}]*)?\}\}/gi, '$1')
    .replace(/\{\{[^}]*\}\}/g, '')
    .replace(/\[\[([^\]|]+\|)?([^\]]+)\]\]/g, '$2')
    .replace(/\[.*?\]/g, '')
    .replace(/\(.*?\)/g, '')
    .replace(/<[^>]+>/g, '')
    .replace(/'''|''/g, '')
    .replace(/^[\s:;.,-–—•*#0-9]+/, '')
    .replace(/\s+/g, ' ')
    .trim();

  if (!limpio) return "";

  let frase = limpio.split(/[.;:]/)[0].trim();
  const palabras = frase.split(/\s+/).filter(Boolean);
  if (palabras.length > 9) {
    frase = palabras.slice(0, 9).join(' ').replace(/[,;:]$/, '');
  }
  if (frase.length < 4) return "";
  frase = frase.charAt(0).toUpperCase() + frase.slice(1);
  return frase.endsWith('.') ? frase : (frase + '.');
}

function obtenerCandidatosRaiz(p) {
  const candidatos = [];
  const agregar = (w) => {
    if (w && w.length >= 3 && !candidatos.includes(w)) candidatos.push(w);
  };

  const sufijos = [
    'arías', 'erías', 'irías', 'ábamos', 'asteis', 'isteis',
    'mente', 'ísimo', 'ísima', 'ísimos', 'ísimas',
    'arote', 'arota', 'etazo', 'etón', 'etona', 'ecito', 'ecita', 'ecillo', 'ecilla',
    'ote', 'ota', 'otes', 'otas', 'azo', 'aza', 'azos', 'azas',
    'ón', 'on', 'ona', 'ones', 'onas', 'ito', 'ita', 'itos', 'itas',
    'illo', 'illa', 'illos', 'illas', 'uco', 'uca', 'ejo', 'eja',
    'tivo', 'tiva', 'tivos', 'tivas', 'ivo', 'iva', 'ivos', 'ivas',
    'dor', 'dora', 'dores', 'doras', 'ble', 'bles', 'oso', 'osa', 'osos', 'osas',
    'ero', 'era', 'eros', 'eras', 'ista', 'istas', 'dad', 'tad',
    'ando', 'iendo', 'ado', 'ada', 'ados', 'adas', 'ido', 'ida', 'idos', 'idas',
    'es', 'as', 'os', 'a', 'o', 's'
  ];

  for (const suf of sufijos) {
    if (p.endsWith(suf) && p.length - suf.length >= 3) {
      const base = p.slice(0, p.length - suf.length);
      agregar(base);
      agregar(base + 'a');
      agregar(base + 'o');
      agregar(base + 'e');
      agregar(base + 'ar');
      agregar(base + 'er');
      agregar(base + 'ir');
    }
  }
  return candidatos;
}

async function consultarWikcionarioHTML(termino) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3200);
    const url = 'https://es.wiktionary.org/w/api.php?action=parse&page=' + encodeURIComponent(termino) + '&prop=text&format=json&origin=*';
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return "";
    const data = await res.json();
    const html = data && data.parse && data.parse.text && data.parse.text['*'];
    if (!html) return "";

    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('.reference, .mw-editsection, style, script, ul, table').forEach(el => el.remove());

    const candidatos = doc.querySelectorAll('dl > dd, ol > li');
    for (const nodo of candidatos) {
      const txt = (nodo.textContent || "").trim();
      if (!txt || txt.length < 5) continue;
      if (/^(Forma del|Plural de|Femenino de|Masculino de|Participio de|Gerundio de|Véase)/i.test(txt)) continue;
      const breve = recortarSignificadoBreve(txt);
      if (breve && breve.length >= 5) return breve;
    }
  } catch (e) {}
  return "";
}

// Buscador de lema en Wikcionario cuando la palabra exacta es una variante o derivado
async function buscarLemaEnWikcionario(termino) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2800);
    const url = 'https://es.wiktionary.org/w/api.php?action=query&list=search&srsearch=' + encodeURIComponent(termino) + '&srlimit=3&format=json&origin=*';
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return "";
    const data = await res.json();
    const resultados = (data && data.query && data.query.search) ? data.query.search : [];
    for (const item of resultados) {
      if (item && item.title && !item.title.includes(':')) {
        const def = await consultarWikcionarioHTML(item.title);
        if (def) return def;
      }
    }
  } catch (e) {}
  return "";
}

async function consultarSinonimosDatamuse(termino) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2800);
    const url = 'https://api.datamuse.com/words?ml=' + encodeURIComponent(termino) + '&v=es&max=10';
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return "";
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) return "";
    const tSin = SinTildes(termino);
    const sinonimos = data
      .map(item => (item && item.word ? item.word.toLowerCase().trim() : ""))
      .filter(w => w && w.length >= 3 && SOLO_LETRAS.test(w) && SinTildes(w) !== tSin)
      .slice(0, 3);
    if (sinonimos.length > 0) {
      const lista = sinonimos.join(', ');
      return 'Sinónimos: ' + lista.charAt(0).toUpperCase() + lista.slice(1) + '.';
    }
  } catch (e) {}
  return "";
}

async function obtenerSignificadoPalabra(palabra) {
  const p = (palabra || "").toLowerCase().trim();
  if (!p) return "Sin palabra activa.";

  // 1. Diccionario local directo o por raíz inmediata
  if (DEFINICIONES_LOCALES[p]) return DEFINICIONES_LOCALES[p];
  const pSin = SinTildes(p);
  if (DEFINICIONES_LOCALES[pSin]) return DEFINICIONES_LOCALES[pSin];

  const candidatosRaiz = obtenerCandidatosRaiz(p);
  for (const cand of candidatosRaiz) {
    if (DEFINICIONES_LOCALES[cand]) return DEFINICIONES_LOCALES[cand];
    const candSin = SinTildes(cand);
    if (DEFINICIONES_LOCALES[candSin]) return DEFINICIONES_LOCALES[candSin];
  }

  // 2. Consulta directa a Wikcionario en español
  let def = await consultarWikcionarioHTML(p);
  if (def) return def;

  // 3. Consulta por raíces candidatas en Wikcionario
  for (const cand of candidatosRaiz.slice(0, 4)) {
    def = await consultarWikcionarioHTML(cand);
    if (def) return def;
  }

  // 4. Búsqueda abierta de lema en Wikcionario
  def = await buscarLemaEnWikcionario(p);
  if (def) return def;

  // 5. Consulta de sinónimos reales en español (Datamuse)
  const sin = await consultarSinonimosDatamuse(p);
  if (sin) return sin;
  for (const cand of candidatosRaiz.slice(0, 3)) {
    const sinRaiz = await consultarSinonimosDatamuse(cand);
    if (sinRaiz) return sinRaiz;
  }

  // 6. Respaldo en Wikipedia en español
  try {
    const urlWiki = 'https://es.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(p);
    const res2 = await fetch(urlWiki);
    if (res2.ok) {
      const data2 = await res2.json();
      if (data2 && data2.extract) {
        const breveWiki = recortarSignificadoBreve(data2.extract);
        if (breveWiki.length > 6) return breveWiki;
      }
    }
  } catch (e) {}

  // 7. Motor offline de raíces léxicas españolas
  for (const [raiz, desc] of RAICES_SIGNIFICADO) {
    if (pSin.startsWith(raiz)) return desc;
  }
  for (const clave of Object.keys(DEFINICIONES_LOCALES)) {
    if (clave.length >= 4 && pSin.startsWith(SinTildes(clave).slice(0, 4))) {
      return DEFINICIONES_LOCALES[clave];
    }
  }

  // 8. Análisis morfológico descriptivo real (sin frases vacías de "Término de la RAE")
  if (/(ar|er|ir)$/.test(p)) return 'Acción de ' + p + ' o llevarla a cabo.';
  if (/(ando|iendo)$/.test(p)) return 'Ejecutando en este momento la acción (' + p + ').';
  if (/(ado|ada|ido|ida)$/.test(p)) return 'Que posee la cualidad o efecto de ' + (candidatosRaiz[0] || p) + '.';
  if (/(ción|cion|sión|sion)$/.test(p)) return 'Proceso, acción y resultado de ' + (candidatosRaiz[0] || p) + '.';
  if (/(dor|dora)$/.test(p)) return 'Que realiza o produce la acción de ' + (candidatosRaiz[0] || p) + '.';
  if (/(oso|osa|ivo|iva|ble)$/.test(p)) return 'Que muestra cualidad o tendencia hacia ' + (candidatosRaiz[0] || p) + '.';

  return 'Elemento, cualidad o acción vinculada con ' + (candidatosRaiz[0] || p) + '.';
}

function pausarReconocimientoMientrasHabla() {
  isListening = false;
  if (window.AndroidVoice) {
    try { window.AndroidVoice.stopListening(); } catch (e) {}
  }
  if (recon) {
    try { if (typeof recon.abort === 'function') recon.abort(); else recon.stop(); } catch (e) {}
  }
  micBtn.classList.remove('bg-red-500', 'animate-pulse');
  micBtn.classList.add('bg-blue-500');
  if (micDeseado) {
    micStatus.textContent = "🔊 Máquina hablando (micrófono en espera)...";
  }
}

function hablar(texto, callback) {
  if (cancelarHablaPrevia) { cancelarHablaPrevia(); cancelarHablaPrevia = null; }
  hablando = true;
  ignorarVozHasta = Date.now() + 15000;

  // Apagar micrófono inmediatamente antes de emitir cualquier sonido
  pausarReconocimientoMientrasHabla();

  let terminado = false;
  let timer = null;
  const cancelar = () => {
    terminado = true;
    clearTimeout(timer);
    if (window.AndroidVoice) { try { window.AndroidVoice.stopSpeak(); } catch (e) {} }
    else if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  };
  const fin = () => {
    if (terminado) return;
    terminado = true;
    clearTimeout(timer);
    if (cancelarHablaPrevia === cancelar) cancelarHablaPrevia = null;
    // Margen antieco de 850 ms tras terminar de hablar antes de aceptar voz
    ignorarVozHasta = Date.now() + 850;
    setTimeout(() => {
      hablando = false;
      if (callback) callback();
      if (micDeseado && modoActual !== "" && !esTurnoMaquina) {
        arrancarRecon();
      }
    }, 400);
  };
  cancelarHablaPrevia = cancelar;
  timer = setTimeout(fin, (texto.length * 105) + 2400);

  if (window.AndroidVoice) {
    window._onNativeTtsDone = fin;
    try {
      window.AndroidVoice.speak(texto);
      return;
    } catch (e) {}
  }

  if (!('speechSynthesis' in window)) {
    fin();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    utterance.rate = 1.0;
    utterance.pitch = 1.05;
    utterance.onend = fin;
    utterance.onerror = fin;
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    fin();
  }
}

function SinTildes(str) {
  return str.replace(/ñ/g, "\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0001/g, "ñ");
}

async function verificarPalabraEnServidor(palabra) {

  if (setDiccionarioRAE) {
    if (setDiccionarioRAE.has(p)) return p;
    const pSin = SinTildes(p);
    const encontrada = arrayDiccionarioRAE.find(w => SinTildes(w) === pSin);

async function obtenerPalabrasCandidatasRAE(prefijoNormalizado) {
  await cargarDiccionarioRAE();
  if (arrayDiccionarioRAE) {
    const todas = arrayDiccionarioRAE.filter(p => {
      if (p.length < 3 || historialPalabras.includes(p)) return false;
      if (!SOLO_LETRAS.test(p)) return false;
      const silabas = silabear(p);
      return silabas.length >= 2 && normalizarSilaba(silabas[0]) === prefijoNormalizado;
    });
    const conocidas = todas.filter(p => DEFINICIONES_LOCALES[p] || DEFINICIONES_LOCALES[SinTildes(p)]);
    if (conocidas.length > 0 && Math.random() < 0.85) return conocidas;
    const comunes = todas.filter(p => p.length >= 4 && p.length <= 7);
    if (comunes.length > 0) return comunes;
    return todas;
  }
  return [];
}

function silabear(palabra) {
  let p = palabra.toLowerCase().trim();
  const vocalesFuertes = 'aeoáéóíú';
  const inseparables = ['br','bl','cr','cl','dr','fr','fl','gr','gl','pr','pl','tr','ch','ll','rr'];
  let silabas = [];
  let silabaActual = "";
  const isVocal = (c) => 'aeiouáéíóúü'.includes(c);
  const isConsonante = (c) => c && !isVocal(c);

  for (let i = 0; i < p.length; i++) {
    let char = p[i];
    silabaActual += char;
    let next1 = p[i+1] || ''; let next2 = p[i+2] || ''; let next3 = p[i+3] || '';
    if (isVocal(char)) {
      if (isVocal(next1) && vocalesFuertes.includes(char) && vocalesFuertes.includes(next1)) {
        silabas.push(silabaActual); silabaActual = ""; continue;
      }
      if (isConsonante(next1)) {
        if (isVocal(next2)) {
          silabas.push(silabaActual); silabaActual = "";
        } else if (isConsonante(next2)) {
          if (isVocal(next3)) {
            let grupo = next1 + next2;
            if (inseparables.includes(grupo)) {
              silabas.push(silabaActual); silabaActual = "";
            } else {
              silabaActual += next1; silabas.push(silabaActual); silabaActual = ""; i++;
            }
          } else if (isConsonante(next3)) {
            let grupo = next2 + next3;
            if (inseparables.includes(grupo)) {
              silabaActual += next1; silabas.push(silabaActual); silabaActual = ""; i++;
            } else {
              silabaActual += next1 + next2; silabas.push(silabaActual); silabaActual = ""; i += 2;
            }
          }
        }
      }
    }
  }
  if (silabaActual !== "") {
    if (silabas.length > 0 && !/[aeiouáéíóúü]/.test(silabaActual)) {
      silabas[silabas.length - 1] += silabaActual;
    } else {
      silabas.push(silabaActual);
    }
  }
  const hardcoded = {
    'palabra': ['pa','la','bra'], 'brasa': ['bra','sa'], 'sapo': ['sa','po'],
    'pomo': ['po','mo'], 'mono': ['mo','no'], 'noto': ['no','to'],
    'tope': ['to','pe'], 'perro': ['pe','rro'], 'roca': ['ro','ca'],
    'carta': ['car','ta'], 'taco': ['ta','co'], 'camino': ['ca','mi','no'],
    'verano': ['ve','ra','no'], 'planeta': ['pla','ne','ta'], 'tesoro': ['te','so','ro'],
    'espejo': ['es','pe','jo'], 'castillo': ['cas','ti','llo'], 'naranja': ['na','ran','ja']
  };
  return hardcoded[p] || silabas;
}

function normalizarSilaba(silaba) {
  return (silaba || "")
    .toLowerCase()
    .replace(/ñ/g, "\u0001")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\u0001/g, "ñ")
    .replace(/rr/g, "r");
}

  indicadorTurno.className = "mt-1.5 text-sm font-bold text-white rounded-full px-4 py-0.5 inline-block shadow-md transition-colors " + colorBg;
}

function mostrarTurnoHumano() {
  const estilo = COLORES_JUGADORES[jugadorActual % COLORES_JUGADORES.length];
  actualizarInterfazTurno("🗣️ Turno de " + nombres[jugadorActual] + " (" + silabaObjetivo.toUpperCase() + ")", estilo.bg);
}

function bloquearInputs(bloquear) {
  textInput.disabled = bloquear;
  sendBtn.disabled = bloquear;
  micBtn.disabled = !recon;
  if (bloquear) {
    btnRendirse.classList.add('opacity-50', 'pointer-events-none');
  } else {
    btnRendirse.classList.remove('opacity-50', 'pointer-events-none');
  }
}

function mostrarFinJuego() {
  juegoTerminado = true;
  esTurnoMaquina = false;
  controlsContainer.classList.add('hidden');
  btnRendirse.classList.add('hidden');
  finJuegoBotones.classList.remove('hidden');
  if (micDeseado) {
    micStatus.textContent = "Di «otra vez» para reiniciar la partida";
    setTimeout(arrancarRecon, 350);
  }
}

window.irAlMenuHome = function() {
  if (cancelarHablaPrevia) { cancelarHablaPrevia(); cancelarHablaPrevia = null; }
  hablando = false;
  modoActual = "";
  juegoTerminado = false;
  esTurnoMaquina = false;
  detenerMicrofono();
  controlsContainer.classList.remove('hidden');
  btnRendirse.classList.remove('hidden');
  finJuegoBotones.classList.add('hidden');
  actualizarMarcadoresUI();
  modalMenu.style.display = 'flex';
  modalMenu.classList.remove('hidden');
};

window.reiniciarMismaPartida = function() {
  if (!modoActual) {
    window.irAlMenuHome();
    return;
  }
  controlsContainer.classList.remove('hidden');
  btnRendirse.classList.remove('hidden');
  finJuegoBotones.classList.add('hidden');
  jugadorActual = 0;
  juegoTerminado = false;
  esTurnoMaquina = false;
  contadorPalabras = 0;
  recordSuperadoEnPartida = false;
  actualizarMarcadoresUI();
  mantenerPantallaActivaTotal();

  // Mantenemos micDeseado = true pero NO abrimos el micro hasta que termine de hablar en iniciarJuegoTablero
  micDeseado = true;
  pausarReconocimientoMientrasHabla();
  iniciarJuegoTablero(true);
};

function agregarPalabraUI(palabra, silabas, esInicial = false, indiceColor = 0, etiqueta = "", definicion = "") {
  const wrapObj = document.createElement('div');
  wrapObj.className = "flex flex-col items-center animate-[flotar_3s_ease-in-out_infinite] w-full relative my-2";

  if (!esInicial) {
    const link = document.createElement('div');
    link.className = "h-8 w-4 border-l-4 border-r-4 border-slate-400 bg-slate-200 rounded-full my-1 absolute -top-6 z-0 shadow-sm";
    wrapObj.appendChild(link);
  }

  const estilo = COLORES_JUGADORES[indiceColor % COLORES_JUGADORES.length];
  const wordDiv = document.createElement('div');
  wordDiv.className = "flex items-center text-3xl sm:text-4xl font-extrabold uppercase z-10 px-6 py-2.5 rounded-full bg-white border-4 " + estilo.border + " shadow-xl relative " + estilo.text + " transition-all";

  silabas.forEach((sil, index) => {
    const span = document.createElement('span');
    span.textContent = sil;
    if (index === 0 && !esInicial) span.className = estilo.sil;
    else if (index === silabas.length - 1) span.className = "text-green-600";
    wordDiv.appendChild(span);
  });

  if (diccionarioEmojis[palabra.toLowerCase()]) {
    const emojiSpan = document.createElement('span');
    emojiSpan.textContent = diccionarioEmojis[palabra.toLowerCase()];
    emojiSpan.className = "absolute -top-6 -right-6 text-5xl animate-bounce drop-shadow-lg";
    wordDiv.appendChild(emojiSpan);
  }

  wrapObj.appendChild(wordDiv);

  if (etiqueta) {
    const tag = document.createElement('div');
    tag.textContent = etiqueta;
    tag.className = "mt-1 z-10 text-xs font-extrabold text-white bg-purple-600 rounded-full px-3 py-0.5 shadow";
    wrapObj.appendChild(tag);
  }

  const defContainer = document.createElement('div');
  defContainer.className = "definicion-palabra-slot w-11/12 max-w-xs";
  if (definicion) {
    defContainer.innerHTML = '<div class="mt-1.5 bg-amber-50 border-2 border-[#a67c52] text-[#5c3a21] text-xs font-bold rounded-xl px-3 py-2 shadow text-center">📖 <strong>' + palabra.toUpperCase() + ':</strong> ' + definicion + '</div>';
  }
  wrapObj.appendChild(defContainer);

  gameBoard.appendChild(wrapObj);
  gameBoard.scrollTop = gameBoard.scrollHeight;
}

function mostrarDefinicionEnUltimaPalabraUI(palabra, definicion) {
  const slots = gameBoard.querySelectorAll('.definicion-palabra-slot');
  if (slots.length > 0) {
    const ultimoSlot = slots[slots.length - 1];
    ultimoSlot.innerHTML = '<div class="mt-1.5 bg-amber-50 border-2 border-[#a67c52] text-[#5c3a21] text-xs font-bold rounded-xl px-3 py-2 shadow text-center">📖 <strong>' + palabra.toUpperCase() + ':</strong> ' + definicion + '</div>';
    gameBoard.scrollTop = gameBoard.scrollHeight;
  }
}

async function explicarUltimaPalabra() {
  if (historialPalabras.length === 0 || juegoTerminado) return;
  const ultima = historialPalabras[historialPalabras.length - 1];
  bloquearInputs(true);
  actualizarInterfazTurno('📖 Significado de "' + ultima + '"...', "bg-amber-600");

  const significado = await obtenerSignificadoPalabra(ultima);
  mostrarDefinicionEnUltimaPalabraUI(ultima, significado);

  hablar(ultima + ": " + significado + " Sigue el turno de " + nombres[jugadorActual] + ", empieza por " + silabaParaVoz(silabaObjetivo) + ".", () => {
    mostrarTurnoHumano();
    bloquearInputs(false);
    arrancarRecon();
  });
}

// ---------- Arranque del Juego: El micrófono NO se activa hasta que la máquina termina de hablar ----------
window.arranqueVinculado = function(modo) {
  window.cerrarPortada();
  try {
    for (let i = 1; i <= 4; i++) {
      const clave = (i === 1) ? 'encadenadas_n1' : (i === 2) ? 'encadenadas_n2' : ('encadenadas_n' + i);
      const el = document.getElementById('input-nombre-' + i);
      if (el) localStorage.setItem(clave, el.value.trim());
    }
  } catch (e) {}

  if (modo === 'pve') {
    const el1 = document.getElementById('input-nombre-1');
    nombres = [(el1 && el1.value.trim()) ? el1.value.trim() : "Jugador 1"];
  } else {
    nombres = [];
    for (let i = 1; i <= window.numJugadores; i++) {
      const el = document.getElementById('input-nombre-' + i);
      nombres.push((el && el.value.trim()) ? el.value.trim() : ("Jugador " + i));
    }
  }

  modoActual = modo;
  jugadorActual = 0;
  juegoTerminado = false;
  esTurnoMaquina = false;
  contadorPalabras = 0;
  recordSuperadoEnPartida = false;
  actualizarMarcadoresUI();

  controlsContainer.classList.remove('hidden');
  btnRendirse.classList.remove('hidden');
  finJuegoBotones.classList.add('hidden');

  modalMenu.classList.add('hidden');
  modalMenu.style.display = 'none';

  mantenerPantallaActivaTotal();

  // Marcamos que queremos usar el micrófono, pero lo mantenemos en pausa mientras la máquina saluda
  micDeseado = true;
  pausarReconocimientoMientrasHabla();
  iniciarJuegoTablero(false);
};

function iniciarJuegoTablero(esReinicio = false) {
  historialPalabras = [];
  gameBoard.innerHTML = '';

  const palabraInicial = palabrasArranque[Math.floor(Math.random() * palabrasArranque.length)];
  const silabasIniciales = silabear(palabraInicial);

  historialPalabras.push(palabraInicial);
  silabaObjetivo = silabasIniciales[silabasIniciales.length - 1];
  agregarPalabraUI(palabraInicial, silabasIniciales, true, 0);

  esTurnoMaquina = false;
  bloquearInputs(true);
  actualizarInterfazTurno("🔊 Presentando primera palabra...", "bg-amber-700");

  const listaSaludo = nombres.length > 1
    ? (nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1])
    : nombres[0];

  const fraseInicio = esReinicio
    ? ("¡Vamos otra vez! Primera palabra: " + palabraInicial + ".")
    : ("¡Hola " + listaSaludo + "! Primera palabra: " + palabraInicial + ".");

  // El micrófono se activa ÚNICAMENTE dentro del callback cuando hablar() ha concluido del todo
  hablar(fraseInicio, () => {
    mostrarTurnoHumano();
    bloquearInputs(false);
    arrancarRecon();
  });
}

async function juegaMaquina() {
  if (modoActual !== 'pve' || juegoTerminado) return;
  actualizarInterfazTurno("📚 Buscando en la RAE...", "bg-purple-500");

  const prefijo = normalizarSilaba(silabaObjetivo);
  const candidatas = await obtenerPalabrasCandidatasRAE(prefijo);

  if (candidatas.length > 0) {
    const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
    await window.procesarEntrada(elegida, true);
  } else {
    actualizarInterfazTurno("¡Victoria de " + nombres[0] + "!", "bg-green-500");
    hablar("¡No quedan palabras en el diccionario que empiecen por " + silabaParaVoz(silabaObjetivo) + "! ¡Has ganado, " + nombres[0] + "! Di otra vez para jugar de nuevo.", () => {
      mostrarFinJuego();
    });
  }
}

window.meRindo = async function() {
  if (esTurnoMaquina || textInput.disabled || juegoTerminado) return;
  bloquearInputs(true);

  const rindiente = nombres[jugadorActual];
  let textoGanador = (modoActual === 'pve')
    ? "¡Gana la máquina!"
    : (nombres.length === 2 ? ("¡Gana " + nombres[1 - jugadorActual] + "!") : ("¡Fin de la partida por rendición de " + rindiente + "!"));

  actualizarInterfazTurno("Consultando RAE y significado...", "bg-red-500");

  hablar(rindiente + " se rinde. Buscando una palabra válida...", async () => {
    const prefijo = normalizarSilaba(silabaObjetivo);
    const candidatas = await obtenerPalabrasCandidatasRAE(prefijo);

    if (candidatas.length > 0) {
      const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
      const silabasElegida = silabear(elegida);
      const significado = await obtenerSignificadoPalabra(elegida);

      historialPalabras.push(elegida);
      silabaObjetivo = silabasElegida[silabasElegida.length - 1];
      agregarPalabraUI(elegida, silabasElegida, false, 1, "💡 Esta valía (RAE)", significado);
      actualizarInterfazTurno("🏆 " + textoGanador, "bg-green-600");

      const msgRecord = recordSuperadoEnPartida ? (" ¡Nuevo récord de " + recordPalabras + " palabras!") : "";
      hablar("Podrías haber dicho: " + elegida + ". " + significado + " " + textoGanador + msgRecord + " Di otra vez para reiniciar.", mostrarFinJuego);
    } else {
      actualizarInterfazTurno("🤝 Empate técnico", "bg-gray-600");
      hablar("No existía ninguna palabra en la RAE con la sílaba " + silabaParaVoz(silabaObjetivo) + ". ¡Empate técnico! Di otra vez para reiniciar.", mostrarFinJuego);
    }
  });
};

function esPreguntaDeSignificado(texto) {
  const limpio = SinTildes((texto || "").toLowerCase().trim());
  return /(que significa|eso que es|que es eso|cual es su significado|cual es el significado|que quiere decir|significado)/.test(limpio);
}

window.procesarEntrada = async function(texto, esMaquina = false) {
  if (juegoTerminado) return;
  if (!esMaquina && (esTurnoMaquina || textInput.disabled || hablando)) return;

  const textoBruto = (texto || "").trim();
  if (!textoBruto) return;

  if (!esMaquina && esPreguntaDeSignificado(textoBruto)) {
    textInput.value = "";
    await explicarUltimaPalabra();
    return;
  }

  if (!esMaquina && /^otra vez$/i.test(textoBruto)) {
    textInput.value = "";
    mostrarAlerta("La orden «otra vez» solo funciona cuando acaba la partida.");
    hablar("La partida aún no ha terminado. Debe empezar por " + silabaParaVoz(silabaObjetivo) + ".");
    return;
  }

  const s2 = normalizarSilaba(silabaObjetivo);
  let palabra = normalizarTokenVoz(textoBruto, s2);
  if (!palabra) return;

  if (!SOLO_LETRAS.test(palabra)) {
    mostrarAlerta("Escribe una sola palabra, solo con letras.");
    textInput.value = "";
    return;
  }
  if (historialPalabras.includes(palabra)) {
    mostrarAlerta("La palabra '" + palabra + "' ya se ha usado.");
    textInput.value = "";
    hablar("La palabra " + palabra + " ya se ha usado. Prueba con otra.");
    return;
  }

  bloquearInputs(true);
  textInput.value = "";

  let silabasWord = silabear(palabra);
  let s1 = normalizarSilaba(silabasWord[0]);

  let jugadaValida = false;
  let vozError = "";
  if (s1 !== s2) {
    mostrarAlerta("¡Error! Debe empezar por '" + silabaObjetivo.toUpperCase() + "', no por '" + silabasWord[0] + "'.");
    vozError = palabra + ", no. Debe empezar por " + silabaParaVoz(silabaObjetivo) + ", no por " + silabaParaVoz(silabasWord[0]) + ". Inténtalo otra vez.";
  } else if (esMaquina) {
    jugadaValida = true;
  } else {
    actualizarInterfazTurno("Consultando RAE...", "bg-yellow-500");
    const formaRAE = await verificarPalabraEnServidor(palabra);
    if (formaRAE && typeof formaRAE === 'string') {
      palabra = formaRAE;
      silabasWord = silabear(palabra);
      jugadaValida = true;
    } else {
      mostrarAlerta("'" + palabra + "' no está en el diccionario RAE.");
      vozError = palabra + " no viene en el diccionario. Inténtalo otra vez.";
    }
  }

  if (!jugadaValida) {
    mostrarTurnoHumano();
    bloquearInputs(false);
    hablar(vozError, () => arrancarRecon());
    return;
  }

  const previoRecord = recordPalabras;
  incrementarContadorPalabras();
  const etiquetaRecord = (contadorPalabras > previoRecord && previoRecord > 0) ? "🔥 ¡Nuevo Récord!" : "";

  historialPalabras.push(palabra);
  silabaObjetivo = silabasWord[silabasWord.length - 1];

  const indiceColor = esMaquina ? 1 : jugadorActual;
  agregarPalabraUI(palabra, silabasWord, false, indiceColor, etiquetaRecord);

  if (modoActual === 'pve') {
    if (esMaquina) {
      hablar(palabra, () => {
        esTurnoMaquina = false;
        mostrarTurnoHumano();
        bloquearInputs(false);
        arrancarRecon();
      });
    } else {
      esTurnoMaquina = true;
      actualizarInterfazTurno("🤖 Máquina pensando...", "bg-purple-500");
      const coletilla = coletillas[Math.floor(Math.random() * coletillas.length)];
      hablar(palabra + ". " + coletilla, () => {
        setTimeout(juegaMaquina, 400);
      });
    }
  } else {
    jugadorActual = (jugadorActual + 1) % nombres.length;
    hablar(palabra, () => {
      mostrarTurnoHumano();
      bloquearInputs(false);
      arrancarRecon();
    });
  }
};

// ---------- Reconocimiento de Voz Inteligente ----------
function uiMic(encendido) {
  micBtn.classList.toggle('bg-red-500', encendido);
  micBtn.classList.toggle('bg-blue-500', !encendido);
  micBtn.classList.toggle('animate-pulse', encendido);
  if (!encendido) micStatus.textContent = "Micrófono apagado";
  else if (juegoTerminado) micStatus.textContent = "Escuchando... (di «otra vez» para reiniciar)";
  else micStatus.textContent = "Escuchando...";
}

function procesarFraseVoz(rawInput) {
  // Ignorar cualquier entrada si la máquina está hablando o en periodo antieco
  if (modoActual === "" || hablando || Date.now() < ignorarVozHasta) return;
  const alternativas = (rawInput || "").split('|').map(s => s.trim().toLowerCase()).filter(Boolean);
  if (alternativas.length === 0) return;

  if (juegoTerminado) {
    for (const alt of alternativas) {
      if (/\b(otra vez|jugar otra vez|otra partida)\b/.test(alt)) {
        window.reiniciarMismaPartida();
        return;
      }
    }
    return;
  }

  if (esTurnoMaquina || textInput.disabled) return;

  for (const alt of alternativas) {
    if (/^(otra vez|jugar otra vez)$/.test(alt)) {
      mostrarAlerta("«Otra vez» solo funciona cuando acaba la partida.");
      hablar("La orden otra vez solo funciona cuando haya acabado la partida. Te toca con " + silabaParaVoz(silabaObjetivo) + ".");
      return;
    }
  }

  for (const alt of alternativas) {
    if (esPreguntaDeSignificado(alt)) {
      explicarUltimaPalabra();
      return;
    }
  }

  for (const alt of alternativas) {
    if (/\b(me rindo|rindo|rendirse)\b/.test(alt)) {
      window.meRindo();
      return;
    }
  }

  const sObj = normalizarSilaba(silabaObjetivo);

  // Filtro adicional contra eco accidental del saludo inicial ("hola")
  if (historialPalabras.length === 1 && sObj !== 'o' && sObj !== 'ho') {
    const limpioInicial = normalizarTokenVoz(alternativas[0].split(/\s+/)[0], sObj);
    if (limpioInicial === 'hola' || limpioInicial === 'primera') return;
  }

  let mejorPalabra = null;
  for (const alt of alternativas) {
    const primera = normalizarTokenVoz(alt.split(/\s+/)[0], sObj);
    if (primera && SOLO_LETRAS.test(primera)) {
      const sils = silabear(primera);
      if (sils.length > 0 && normalizarSilaba(sils[0]) === sObj) {
        mejorPalabra = primera;
        break;
      }
    }
  }

  if (!mejorPalabra) {
    mejorPalabra = normalizarTokenVoz(alternativas[0].split(/\s+/)[0], sObj);
  }
  if (mejorPalabra) {
    window.procesarEntrada(mejorPalabra);
  }
}

try {
  if (window.AndroidVoice) {
    recon = {
      start() { window.AndroidVoice.startListening(); },
      stop() { window.AndroidVoice.stopListening(); },
      abort() { window.AndroidVoice.stopListening(); }
    };
    window._onNativeSrStart = () => {
      if (hablando) {
        pausarReconocimientoMientrasHabla();
        return;
      }
      isListening = true;
      uiMic(true);
    };
    window._onNativeSrResult = (frase) => { procesarFraseVoz(frase); };
    window._onNativeSrError = (err) => {
      isListening = false;
      if (err === 'not-allowed') {
        micDeseado = false;
        uiMic(false);
        micStatus.textContent = "Permiso de micrófono denegado";
      }
    };
    window._onNativeSrEnd = () => {
      isListening = false;
      if (micDeseado && modoActual !== "" && !hablando) setTimeout(arrancarRecon, 350);
      else if (!micDeseado) uiMic(false);
    };
  } else if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recon = new SpeechRecognition();
    recon.lang = 'es-ES';
    recon.continuous = true;
    recon.interimResults = false;
    recon.maxAlternatives = 5;
    recon.onstart = () => {
      if (hablando) {
        pausarReconocimientoMientrasHabla();
        return;
      }
      isListening = true;
      uiMic(true);
    };
    recon.onresult = (event) => {
      if (hablando || Date.now() < ignorarVozHasta) return;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (!result.isFinal) continue;
        const alts = [];
        for (let j = 0; j < result.length; j++) alts.push(result[j].transcript);
        procesarFraseVoz(alts.join('|'));
      }
    };
    recon.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        if (document.visibilityState !== 'visible') return;
        micDeseado = false;
        uiMic(false);
        micStatus.textContent = "Permiso de micrófono denegado";
      }
    };
    recon.onend = () => {
      isListening = false;
      if (micDeseado && modoActual !== "" && !hablando) {
        micStatus.textContent = "Reconectando micrófono...";
        setTimeout(arrancarRecon, 300);
      } else if (!micDeseado) {
        uiMic(false);
      }
    };
  } else {
    micStatus.textContent = "Voz no soportada";
    micBtn.disabled = true;
    micBtn.classList.replace('bg-blue-500', 'bg-gray-400');
  }
} catch (e) {}

setInterval(() => {
  if (micDeseado && !isListening && !hablando && modoActual !== "" && document.visibilityState === 'visible') {
    arrancarRecon();
  }
}, 2500);

function arrancarRecon(intentos = 0) {
  if (!recon || !micDeseado || isListening || hablando || modoActual === "") return;
  try {
    recon.start();
  } catch (err) {
    if (intentos < 20) setTimeout(() => arrancarRecon(intentos + 1), 300);
  }
}

function iniciarMicrofono() {
  if (!recon || modoActual === "") return;
  micDeseado = true;
  if (!hablando) arrancarRecon();
}

window.alternarMicrofono = function() {
  if (micDeseado) detenerMicrofono();
  else iniciarMicrofono();
};

function detenerMicrofono() {
  micDeseado = false;
  isListening = false;
  try { if (recon) recon.stop(); } catch (e) {}
  uiMic(false);
}

pedirWakeLock();

    }

    async function showInterstitialThen(callback) {
      try {
        if (interstitialReady) {
          await callAdMob('showInterstitial', {});
          interstitialReady = false;
          preloadInterstitial();
        }
      } catch (e) {}
      if (callback) callback();
    }

    window.addEventListener('load', async () => {
      try {
        await callAdMob('initialize', { initializeForTesting: false });
        try {
          await callAdMob('showBanner', {
            adId: BANNER_ID,
            adSize: 'ADAPTIVE_BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: false
          });
        } catch (errReal) {
          await callAdMob('showBanner', {
            adId: BANNER_ID,
            adSize: 'ADAPTIVE_BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: true
          });
        }
        await preloadInterstitial();
      } catch (e) {}
    });

    const origReiniciar = window.reiniciarMismaPartida;
    window.reiniciarMismaPartida = function() {
      showInterstitialThen(() => origReiniciar());
    };
  } catch (e) {}
})();
</script>
</body>
</html>
