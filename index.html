// ---------- Diccionario Castellano Local (RAE) ----------
let setDiccionarioRAE = null;
let arrayDiccionarioRAE = null;

async function cargarDiccionarioRAE() {
  if (setDiccionarioRAE) return true;
  try {
    const res = await fetch('diccionario.json');
    if (!res.ok) throw new Error('No local dict');
    const lista = await res.json();
    arrayDiccionarioRAE = lista.map(w => w.toLowerCase().trim());
    setDiccionarioRAE = new Set(arrayDiccionarioRAE);
    console.log("Diccionario RAE cargado:", setDiccionarioRAE.size, "palabras");
    return true;
  } catch (e) {
    console.warn("Usando respaldo online:", e);
    return false;
  }
}
cargarDiccionarioRAE();

// ---------- Traductor Fonético de Voz (Letras y Números que el micro abrevia) ----------
const MAPA_VOZ_EXACTO = {
  'b': 'be', 'v': 'uve', 'c': 'ce', 'd': 'de', 'f': 'efe', 'g': 'ge',
  'h': 'hache', 'j': 'jota', 'k': 'ka', 'l': 'ele', 'll': 'elle',
  'm': 'eme', 'n': 'ene', 'ñ': 'eñe', 'p': 'pe', 'q': 'cu', 'r': 'erre',
  's': 'ese', 't': 'te', 'w': 'uve', 'x': 'equis', 'z': 'zeta',
  '0': 'cero', '1': 'uno', '2': 'dos', '3': 'tres', '4': 'cuatro',
  '5': 'cinco', '6': 'seis', '7': 'siete', '8': 'ocho', '9': 'nueve',
  '10': 'diez', '11': 'once', '12': 'doce', '13': 'trece', '14': 'catorce',
  '15': 'quince', '20': 'veinte', '30': 'treinta', '100': 'cien', '1000': 'mil'
};

function normalizarTokenVoz(token, silabaObjNorm) {
  let limpio = (token || "").trim().toLowerCase().replace(/[.,!?;:¡¿"']/g, '');
  if (!limpio) return "";
  if (MAPA_VOZ_EXACTO[limpio]) {
    // Caso especial para "c" (ce / se), "b" (be / ve) según la sílaba que toque
    if (limpio === 'c' && silabaObjNorm === 'se') return 'se';
    if ((limpio === 'b' || limpio === 'v') && silabaObjNorm === 've') return 've';
    if ((limpio === 'b' || limpio === 'v') && silabaObjNorm === 'be') return 'be';
    if (limpio === 'z' && silabaObjNorm === 'ce') return 'ce';
    return MAPA_VOZ_EXACTO[limpio];
  }
  return limpio;
}

const SOLO_LETRAS = /^[a-záéíóúüñ]+$/;

// ---------- Wake Lock y KeepAlive ----------
async function pedirWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}

function crearSilencio() {
  const n = 8000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b[44 + i] = 128 + (i % 2 ? 1 : -1);
  const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
  a.loop = true; a.volume = 0.05;
  return a;
}
function prepararKeepAlive() {
  try {
    silencio = silencio || crearSilencio();
    silencio.play().then(() => silencio.pause()).catch(() => {});
  } catch (e) {}
}
function partidaActiva() { return modoActual !== "" && !juegoTerminado; }
function empezarKeepAlive() {
  if (!partidaActiva() || !silencio) return;
  silencio.play().catch(() => {});
  try {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Encadenadas', artist: 'Partida en curso' });
      navigator.mediaSession.playbackState = 'playing';
    }
  } catch (e) {}
}
function pararKeepAlive() {
  try { if (silencio) silencio.pause(); } catch (e) {}
  try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none'; } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    pararKeepAlive();
    pedirWakeLock();
    try { window.speechSynthesis?.resume(); } catch (e) {}
    arrancarRecon();
  } else {
    empezarKeepAlive();
  }
});

// ---------- Voz (Síntesis Híbrida: Nativa Android + Web) ----------
function hablar(texto, callback) {
  if (cancelarHablaPrevia) { cancelarHablaPrevia(); cancelarHablaPrevia = null; }
  hablando = true;

  if (window.AndroidVoice && isListening) {
    try { window.AndroidVoice.stopListening(); } catch (e) {}
    isListening = false;
  }

  let terminado = false;
  let timer = null;
  const cancelar = () => {
    terminado = true;
    clearTimeout(timer);
    if (window.AndroidVoice) { try { window.AndroidVoice.stopSpeak(); } catch (e) {} }
    else if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  };
  const fin = () => {
    if (terminado) return;
    terminado = true;
    clearTimeout(timer);
    if (cancelarHablaPrevia === cancelar) cancelarHablaPrevia = null;
    hablando = false;
    ignorarVozHasta = Date.now() + 650;
    if (callback) callback();
    if (micDeseado && !juegoTerminado && !esTurnoMaquina) {
      setTimeout(arrancarRecon, 250);
    }
  };
  cancelarHablaPrevia = cancelar;
  timer = setTimeout(fin, (texto.length * 110) + 2500);

  if (window.AndroidVoice) {
    window._onNativeTtsDone = fin;
    try {
      window.AndroidVoice.speak(texto);
      return;
    } catch (e) {}
  }

  if (!('speechSynthesis' in window)) {
    fin();
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'es-ES';
  utterance.rate = 1.0;
  utterance.pitch = 1.05;
  utterance.onend = fin;
  utterance.onerror = fin;
  window.speechSynthesis.speak(utterance);
}

// ---------- Comprobación en Diccionario RAE (con variación de tildes) ----------
function SinTildes(str) {
  return str.replace(/ñ/g, "\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0001/g, "ñ");
}

async function verificarPalabraEnServidor(palabra) {
  await cargarDiccionarioRAE();
  const p = palabra.toLowerCase().trim();
  if (setDiccionarioRAE) {
    if (setDiccionarioRAE.has(p)) return p;
    // Si el usuario escribió sin tilde (ej. "docil" o "rapido"), buscamos la forma acentuada en la RAE
    const pSin = SinTildes(p);
    const encontrada = arrayDiccionarioRAE.find(w => SinTildes(w) === pSin);
    return encontrada || false;
  }
  // Respaldo por si aún no cargó el archivo local
  try {
    const res = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(p)}&max=10&v=es`);
    const data = await res.json();
    const ok = data.some(item => item.word.toLowerCase() === p);
    return ok ? p : false;
  } catch (e) {
    return null;
  }
}

async function obtenerPalabrasCandidatasRAE(prefijoNormalizado) {
  await cargarDiccionarioRAE();
  if (arrayDiccionarioRAE) {
    return arrayDiccionarioRAE.filter(p => {
      if (p.length < 3 || historialPalabras.includes(p)) return false;
      if (!SOLO_LETRAS.test(p)) return false;
      const silabas = silabear(p);
      return silabas.length >= 2 && normalizarSílaba(silabas[0]) === prefijoNormalizado;
    });
  }
  return [];
}

      }
    }
