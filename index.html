// Cierre de portada independiente: funciona siempre aunque falle cualquier script posterior
window.cerrarPortada = function() {
  var p = document.getElementById('pantalla-portada');
  if (p) {
    p.style.opacity = '0';
    p.style.pointerEvents = 'none';
    setTimeout(function() { p.style.display = 'none'; }, 300);
  }
};
window.addEventListener('DOMContentLoaded', function() {
  setTimeout(window.cerrarPortada, 3000);
});

// ---------- Estado ----------
let historialPalabras = [];
let silabaObjetivo = "";
let modoActual = ""; // "" ( en menú ) | "pve" | "pvp"
let esTurnoMaquina = false;
let numJugadores = 2;
let nombres = ["Jugador 1", "Jugador 2"];
let jugadorActual = 0;
let juegoTerminado = false;
let contadorPalabras = 0;
let recordPalabras = 0;
let recordSuperadoEnPartida = false;

let recon = null;
let isListening = false;
let micDeseado = false;
let hablando = false;
let ignorarVozHasta = 0;
let alertTimer = null;
let cancelarHablaPrevia = null;
let wakeLock = null;
let silencio = null;

const COLORES_JUGADORES = [
  { bg: "bg-blue-600", border: "border-orange-500", text: "text-blue-600", sil: "text-orange-500" },
  { bg: "bg-orange-600", border: "border-purple-500", text: "text-purple-700", sil: "text-purple-500" },
  { bg: "bg-emerald-600", border: "border-emerald-500", text: "text-emerald-700", sil: "text-emerald-500" },
  { bg: "bg-pink-600", border: "border-pink-500", text: "text-pink-700", sil: "text-pink-500" },
  { bg: "bg-indigo-600", border: "border-indigo-500", text: "text-indigo-700", sil: "text-indigo-500" },
  { bg: "bg-teal-600", border: "border-teal-500", text: "text-teal-700", sil: "text-teal-500" }
];

// ---------- Récord y Contador ----------
function cargarRecord() {
  try {
    recordPalabras = parseInt(localStorage.getItem('encadenadas_record') || '0', 10) || 0;
  } catch (e) {
    recordPalabras = 0;
  }
  actualizarMarcadoresUI();
}

function actualizarMarcadoresUI() {
  spanContadorPalabras.textContent = contadorPalabras;
  spanRecordPalabras.textContent = recordPalabras;
  spanMenuRecord.textContent = recordPalabras;
}

function incrementarContadorPalabras() {
  contadorPalabras++;
  if (contadorPalabras > recordPalabras) {
    recordPalabras = contadorPalabras;
    recordSuperadoEnPartida = true;
    try { localStorage.setItem('encadenadas_record', String(recordPalabras)); } catch (e) {}
  }
  actualizarMarcadoresUI();
}

// ---------- Diccionario Castellano Local (RAE) ----------
let setDiccionarioRAE = null;
let arrayDiccionarioRAE = null;
let cargandoDiccionario = null;

async function cargarDiccionarioRAE() {
  if (setDiccionarioRAE) return true;
  if (cargandoDiccionario) return cargandoDiccionario;
  cargandoDiccionario = (async () => {
    try {
      const res = await fetch('diccionario.json');
      if (!res.ok) throw new Error('No local dict');
      const lista = await res.json();
      arrayDiccionarioRAE = lista;
      setDiccionarioRAE = new Set(lista);
      return true;
    } catch (e) {
      return false;
    }
  })();
  return cargandoDiccionario;
}
setTimeout(cargarDiccionarioRAE, 600);

// ---------- Diccionario de Significados (Local + Wikcionario / Wikipedia) ----------
const DEFINICIONES_LOCALES = {
  'palabra': 'Unidad lingüística con significado propio que empleamos para hablar o escribir.',
  'camino': 'Vía o tierra transitada para ir de un lugar a otro.',
  'verano': 'Estación más calurosa del año, situada entre la primavera y el otoño.',
  'planeta': 'Cuerpo celeste sin luz propia que gira alrededor de una estrella.',
  'tesoro': 'Conjunto de dinero, joyas u objetos de gran valor guardados o ocultos.',
  'espejo': 'Superficie de cristal pulido que refleja la imagen de los objetos situados delante.',
  'castillo': 'Edificio fortificado con murallas y torres para la defensa.',
  'naranja': 'Fruto del naranjo, de forma redonda, cáscara rugosa y pulpa jugosa.',
  'pelota': 'Bola elástica que se utiliza en numerosos deportes y juegos.',
  'regalo': 'Obsequio que se entrega a otra persona como muestra de afecto.',
  'melón': 'Fruto grande de corteza surcada y pulpa dulce y muy jugosa.',
  'loco': 'Que ha perdido la razón o actúa de manera imprudente y disparatada.',
  'casa': 'Edificación construida para ser habitada por personas.',
  'perro': 'Mamífero doméstico de la familia de los cánidos, famoso por su lealtad.',
  'roca': 'Material mineral sólido y duro que forma parte de la corteza terrestre.',
  'sapo': 'Anfibio sin cola, de cuerpo robusto y piel rugosa.'
};

function limpiarDefinicionTexto(texto) {
  if (!texto) return "";
  let limpio = texto
    .replace(/\[.*?\]/g, '')
    .replace(/\(.*?\)/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  const primeraFrase = limpio.split(/\.\s+/)[0];
  if (primeraFrase && primeraFrase.length > 8) {
    return primeraFrase.endsWith('.') ? primeraFrase : primeraFrase + '.';
  }
  return limpio.slice(0, 180);
}

async function obtenerSignificadoPalabra(palabra) {
  const p = (palabra || "").toLowerCase().trim();
  if (!p) return "No hay ninguna palabra activa todavía.";
  if (DEFINICIONES_LOCALES[p]) return DEFINICIONES_LOCALES[p];

  // 1. Consultar Wikcionario en español (definiciones de diccionario RAE/castellano)
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3200);
    const urlWik = `https://es.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(p)}&format=json&origin=*`;
    const res = await fetch(urlWik, { signal: controller.signal });
    clearTimeout(timer);
    if (res.ok) {
      const data = await res.json();
      const pages = data?.query?.pages || {};
      const page = Object.values(pages)[0];
      if (page && page.extract) {
        const lineas = page.extract.split('\n').map(l => l.trim()).filter(Boolean);
        // Buscar la primera acepción numerada (ej. "1 En...", ";1:", "1.")
        for (const linea of lineas) {
          if (/^;?\d+[\s.:]/.test(linea)) {
            const acepcion = limpiarDefinicionTexto(linea.replace(/^;?\d+[\s.:]+/, ''));
            if (acepcion.length > 10) return acepcion;
          }
        }
        // O primera línea descriptiva que no sea un encabezado "== ... =="
        const descriptiva = lineas.find(l => !l.startsWith('=') && l.length > 20 && !l.toLowerCase().includes('etimología'));
        if (descriptiva) {
          const def = limpiarDefinicionTexto(descriptiva);
          if (def.length > 10) return def;
        }
      }
    }
  } catch (e) {}

  // 2. Respaldo en Wikipedia en español
  try {
    const controller2 = new AbortController();
    const timer2 = setTimeout(() => controller2.abort(), 2800);
    const urlWiki = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(p)}
