    p.style.pointerEvents = 'none';

<!-- SCRIPT 1: CONTROL DEL MENÚ Y JUGADORES (2 A 4) -->
<script>
window.numJugadores = 2;

window.elegirJugadores = function(n) {
  if (n < 2) n = 2;
  if (n > 4) n = 4;
  window.numJugadores = n;
  try { localStorage.setItem('encadenadas_num_jug', String(n)); } catch (e) {}
  for (var i = 2; i <= 4; i++) {
    var btn = document.getElementById('btn-num-' + i);
    if (btn) {
      btn.className = (i === n)
        ? "bg-orange-600 text-white font-black py-2 rounded-xl border-2 border-[#5c3a21] shadow active:scale-95"
        : "bg-white text-slate-700 font-black py-2 rounded-xl border-2 border-orange-300 shadow active:scale-95";
    }
  }
  for (var j = 1; j <= 4; j++) {
    var inp = document.getElementById('input-nombre-' + j);
    if (inp) {
      if (j <= n) inp.classList.remove('hidden');
      else inp.classList.add('hidden');
    }
  }
  window.actualizarTextoBotones();
};

window.actualizarTextoBotones = function() {
  var inp1 = document.getElementById('input-nombre-1');
  var inp2 = document.getElementById('input-nombre-2');
  var n1 = (inp1 && inp1.value.trim()) ? inp1.value.trim() : "Jugador 1";
  var n2 = (inp2 && inp2.value.trim()) ? inp2.value.trim() : "Jugador 2";
  var tPve = document.getElementById('txt-pve');
  var tPvp = document.getElementById('txt-pvp');
  if (tPve) tPve.textContent = "👤 " + n1 + " vs 🤖 Máquina";
  if (tPvp) {
    if (window.numJugadores === 2) {
      tPvp.textContent = "👤 " + n1 + " vs 👤 " + n2;
    } else {
      tPvp.textContent = "👥 Jugar " + window.numJugadores + " Jugadores";
    }
  }
};

window.cargarDatosMenu = function() {
  try {
    var rec = parseInt(localStorage.getItem('encadenadas_record') || '0', 10) || 0;
    document.getElementById('menu-record').textContent = rec;
    document.getElementById('record-palabras').textContent = rec;
    var guardados = parseInt(localStorage.getItem('encadenadas_num_jug') || '2', 10);
    if (guardados >= 2 && guardados <= 4) window.numJugadores = guardados;
    else window.numJugadores = 2;
    for (var i = 1; i <= 4; i++) {
      var clave = (i === 1) ? 'encadenadas_n1' : (i === 2) ? 'encadenadas_n2' : ('encadenadas_n' + i);
      var val = localStorage.getItem(clave) || "";
      var el = document.getElementById('input-nombre-' + i);
      if (el) el.value = val;
    }
  } catch (e) {}
  window.elegirJugadores(window.numJugadores);
};
window.cargarDatosMenu();
</script>

// ---------- Pronunciación natural de sílabas (sin deletrear y "tó" en español) ----------

};

function silabaParaVoz(silaba) {
  let s = (silaba || "").toLowerCase().trim();
  if (!s) return "";
  if (FONETICA_SILABAS_VOZ[s]) return FONETICA_SILABAS_VOZ[s];
  if (/[áéíóú]/.test(s)) return s;

  s = s.replace(/^ge/, 'je').replace(/^gi/, 'ji').replace(/^que/, 'ke').replace(/^qui/, 'ki');

  const mapaTilde = { 'a': 'á', 'e': 'é', 'i': 'í', 'o': 'ó', 'u': 'ú' };
  const fuertes = ['a', 'e', 'o'];
  for (let i = s.length - 1; i >= 0; i--) {
    if (fuertes.includes(s[i])) {
      return s.slice(0, i) + mapaTilde[s[i]] + s.slice(i + 1);
    }
  }
  for (let i = s.length - 1; i >= 0; i--) {
    if (mapaTilde[s[i]]) {
      return s.slice(0, i) + mapaTilde[s[i]] + s.slice(i + 1);
    }
  }
  return s;
}

function actualizarMarcadoresUI() {

    recordSuperadoEnPartida = true;
    try { localStorage.setItem('encadenadas_record', String(recordPalabras)); } catch (e) {}
  }
  actualizarMarcadoresUI();
}

// ---------- TRIPLE SISTEMA ANTIBLOQUEO DE PANTALLA (SIEMPRE ENCENDIDA) ----------
async function pedirWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => {
        wakeLock = null;
        if (document.visibilityState === 'visible') {
          setTimeout(pedirWakeLock, 500);
        }
      });
    }
  } catch (e) { wakeLock = null; }

  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) {
      window.Capacitor.Plugins.KeepAwake.keepAwake();
    }
  } catch (e) {}
}

function activarVideoNoSleep() {
  try {
    if (videoWakeLock) {
      if (videoWakeLock.paused) videoWakeLock.play().catch(() => {});
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 2;
    canvas.height = 2;
    const ctx = canvas.getContext('2d');
    setInterval(() => {
      if (ctx) {
        ctx.fillStyle = (Date.now() % 2 === 0) ? '#000000' : '#010101';
        ctx.fillRect(0, 0, 2, 2);
      }
    }, 1000);

    if (typeof canvas.captureStream === 'function') {
      const v = document.createElement('video');
      v.setAttribute('playsinline', '');
      v.setAttribute('muted', '');
      v.muted = true;
      v.loop = true;
      v.style.position = 'fixed';
      v.style.top = '-10px';
      v.style.left = '-10px';
      v.style.width = '1px';
      v.style.height = '1px';
      v.style.opacity = '0.01';
      v.style.pointerEvents = 'none';
      v.srcObject = canvas.captureStream(1);
      document.body.appendChild(v);
      v.play().catch(() => {});
      videoWakeLock = v;
    }
  } catch (e) {}
}

function crearSilencio() {
  const n = 8000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) b[44 + i] = 128 + (i % 2 ? 1 : -1);
  const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
  a.loop = true; a.volume = 0.02;
  return a;
}

function mantenerPantallaActivaTotal() {

  try {
    silencio = silencio || crearSilencio();

  } catch (e) {}
}

function SinTildes(str) {
  return (str || "").replace(/ñ/g, "\u0001").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0001/g, "ñ");
}

function indexarBasico(obj) {

  mapSinTildesBasico = new Map();
  for (let i = 0; i < arrayBasico.length; i++) {
    const w = arrayBasico[i];
    const s = SinTildes(w);
    if (!mapSinTildesBasico.has(s)) mapSinTildesBasico.set(s, w);
  }
}

function obtenerSingularesDePlural(p) {
  const candidatos = [];
  const add = (word, regla) => {
    if (word && word.length >= 2 && !candidatos.some(c => c.word === word)) {
      candidatos.push({ word, regla });
    }
  };
  if (p.endsWith('ces') && p.length >= 4) {
    add(p.slice(0, -3) + 'z', 'ces');
  }
  if (p.endsWith('es') && p.length >= 4) {
    const baseEs = p.slice(0, -2);
    if (/[bcdfghjklmnñpqrstvwxyíú]$/.test(baseEs)) {
      add(baseEs, 'es');
    }
  }
  if (p.endsWith('s') && p.length >= 3) {
    add(p.slice(0, -1), 's');
  }
  return candidatos;
}

function buscarEnDiccionarioLocal(palabra) {
  const p = (palabra || "").toLowerCase().trim();
  if (!p) return false;
  const pSin = SinTildes(p);

  if (diccionarioBasico[p]) return p;
  if (mapSinTildesBasico.has(pSin)) return mapSinTildesBasico.get(pSin);

  if (setDiccionarioRAE) {
    if (setDiccionarioRAE.has(p)) return p;
    if (mapSinTildesRAE && mapSinTildesRAE.has(pSin)) {
      return mapSinTildesRAE.get(pSin);
    }
  }
  return false;
}

function convertirPluralASingularLocal(palabra) {
  const p = (palabra || "").toLowerCase().trim();
  if (!p || !p.endsWith('s') || p.length < 3) return null;
  const pSin = SinTildes(p);
  if (EXCEPCIONES_NO_PLURAL.has(p) || EXCEPCIONES_NO_PLURAL.has(pSin)) return null;

  const singulares = obtenerSingularesDePlural(p);
  for (const { word: cand, regla } of singulares) {
    const sing = buscarEnDiccionarioLocal(cand);
    if (!sing) continue;

    if (regla === 'ces' && sing.endsWith('z')) return sing;
    if (regla === 'es' && /[bcdfghjklmnñpqrstvwxyíú]$/.test(sing)) return sing;
    if (regla === 's' && /[aeiouáéíóúbcdfgklmnpt]$/.test(sing)) return sing;
  }
  return null;
}

// ---------- Consulta de Definición (Básico Offline) + Respaldo de Sinónimos ----------
function buscarDefinicionEnBasico(palabra) {
  const p = (palabra || "").toLowerCase().trim();
  if (!p) return "";
  if (diccionarioBasico[p]) return diccionarioBasico[p];
  const pSin = SinTildes(p);
  if (mapSinTildesBasico.has(pSin)) return diccionarioBasico[mapSinTildesBasico.get(pSin)];

  const singulares = obtenerSingularesDePlural(p);
  for (const { word: sing } of singulares) {
    if (diccionarioBasico[sing]) return diccionarioBasico[sing];
    const singSin = SinTildes(sing);
    if (mapSinTildesBasico.has(singSin)) return diccionarioBasico[mapSinTildesBasico.get(singSin)];
  }
  return "";
}

async function consultarSinonimosWikcionario(termino) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 3000);
    const url = 'https://es.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&titles=' + encodeURIComponent(termino) + '&format=json&origin=*';
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return [];
    const data = await res.json();
    const pages = (data && data.query && data.query.pages) ? data.query.pages : {};
    const page = Object.values(pages)[0];
    if (!page || page.missing !== undefined) return [];
    const raw = (page.revisions && page.revisions[0] && page.revisions[0].slots && page.revisions[0].slots.main)
      ? page.revisions[0].slots.main['*']
      : (page.revisions && page.revisions[0] ? page.revisions[0]['*'] : "");
    if (!raw) return [];

    const matchEs = raw.match(/==\s*\{\{lengua\|es\}\}\s*==/i);
    if (!matchEs) return [];
    const inicioEs = matchEs.index + matchEs[0].length;
    const resto = raw.slice(inicioEs);
    const sigLengua = resto.search(/==\s*\{\{lengua\|/i);
    const seccionEs = sigLengua >= 0 ? resto.slice(0, sigLengua) : resto;

    const encontrados = [];
    const tSin = SinTildes(termino);
    const agregarSin = (cand) => {
      const w = (cand || "").toLowerCase().replace(/\[\[|\]\]|'''|''/g, '').trim();
      if (!w || !SINONIMO_LIMPIO.test(w)) return;
      if (SinTildes(w) === tSin) return;
      if (!encontrados.includes(w)) encontrados.push(w);
    };

    const regexTpl = /\{\{sin[óo]nimos?\|([^}]+)\}\}/gi;
    let m;
    while ((m = regexTpl.exec(seccionEs)) !== null) {
      for (const parte of m[1].split('|')) {
        if (parte.includes('=')) continue;
        const limpio = parte.trim().toLowerCase();
        if (limpio === 'es' || limpio === 'leng') continue;
        agregarSin(limpio);
      }
    }

    const regexLin = /Sin[óo]nimos?\s*:?\s*([^\n]+)/gi;
    while ((m = regexLin.exec(seccionEs)) !== null) {
      const linea = m[1];
      if (/↑|DEX|Diccionario|http/i.test(linea)) continue;
      const enlaces = linea.match(/\[\[([^\]|#]+)(?:\|[^\]]+)?\]\]/g);
      if (enlaces) {
        for (const en of enlaces) {
          agregarSin(en.replace(/^\[\[|\]\]$/g, '').split('|')[0]);
        }
      }
    }
    return encontrados.slice(0, 4);
  } catch (e) {
    return [];
  }
}

async function consultarSinonimosDatamuse(termino) {
  const tSin = SinTildes(termino);
  const endpoints = [
    'https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(termino) + '&v=es&max=8',
    'https://api.datamuse.com/words?ml=' + encodeURIComponent(termino) + '&v=es&max=10'
  ];

  for (const url of endpoints) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2600);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) continue;

      const lista = [];
      for (const item of data) {
        const w = (item && item.word) ? item.word.toLowerCase().trim() : "";
        if (!w || !SINONIMO_LIMPIO.test(w)) continue;
        if (SinTildes(w) === tSin) continue;
        if (!lista.includes(w)) lista.push(w);
        if (lista.length >= 4) break;
      }
      if (lista.length > 0) return lista;
    } catch (e) {}
  }
  return [];
}

async function obtenerExplicacionPalabra(palabra) {
  await cargarDiccionarioBasico();
  const p = (palabra || "").toLowerCase().trim();
  if (!p) return { tipo: 'ninguno', texto: '' };

  // 1. Prioridad total: definición clara y breve del diccionario básico offline
  const defBasica = buscarDefinicionEnBasico(p);
  if (defBasica) {
    return { tipo: 'definicion', texto: defBasica };
  }

  // 2. Respaldo para palabras avanzadas (fuera del básico): buscar solo sinónimos reales
  let syns = await consultarSinonimosWikcionario(p);
  if (syns.length > 0) return { tipo: 'sinonimos', texto: syns.join(', ') };

  syns = await consultarSinonimosDatamuse(p);
  if (syns.length > 0) return { tipo: 'sinonimos', texto: syns.join(', ') };

  return { tipo: 'ninguno', texto: '' };
}

function pausarReconocimientoMientrasHabla(mensajeEstado) {
  isListening = false;
  if (window.AndroidVoice) {
    try { window.AndroidVoice.stopListening(); } catch (e) {}
  }
  if (recon) {
    try { if (typeof recon.abort === 'function') recon.abort(); else recon.stop(); } catch (e) {}
  }
  micBtn.classList.remove('bg-red-500', 'animate-pulse');
  micBtn.classList.add('bg-blue-500');
  if (mensajeEstado) {
    micStatus.textContent = mensajeEstado;
  } else if (micDeseado) {
    micStatus.textContent = "🔊 Máquina hablando (micrófono en espera)...";
  }
}

window.pausarTodoParaAnuncio = function() {
  if (cancelarHablaPrevia) {
    cancelarHablaPrevia();
    cancelarHablaPrevia = null;
  }
  hablando = false;
  ignorarVozHasta = Date.now() + 60000;
  pausarReconocimientoMientrasHabla("⏳ Esperando a que termine el anuncio...");
};

function hablar(texto, callback) {
  if (window._anuncioPantallaCompletaActivo) return;
  if (cancelarHablaPrevia) { cancelarHablaPrevia(); cancelarHablaPrevia = null; }
  hablando = true;
  ignorarVozHasta = Date.now() + 15000;

  pausarReconocimientoMientrasHabla();

  let terminado = false;
  let timer = null;
  const cancelar = () => {
    terminado = true;
    clearTimeout(timer);
    if (window.AndroidVoice) { try { window.AndroidVoice.stopSpeak(); } catch (e) {} }
    else if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  };
  const fin = () => {
    if (terminado) return;
    terminado = true;
    clearTimeout(timer);
    if (cancelarHablaPrevia === cancelar) cancelarHablaPrevia = null;
    ignorarVozHasta = Date.now() + 850;
    setTimeout(() => {
      hablando = false;
      if (window._anuncioPantallaCompletaActivo) return;
      if (callback) callback();
      if (micDeseado && modoActual !== "" && !esTurnoMaquina) {
        arrancarRecon();
      }
    }, 400);
  };
  cancelarHablaPrevia = cancelar;
  timer = setTimeout(fin, (texto.length * 105) + 2400);

  if (window.AndroidVoice) {
    window._onNativeTtsDone = fin;
    try {
      window.AndroidVoice.speak(texto);
      return;
    } catch (e) {}
  }

  if (!('speechSynthesis' in window)) {
    fin();
    return;
  }
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'es-ES';
    utterance.rate = 1.0;
    utterance.pitch = 1.05;
    utterance.onend = fin;
    utterance.onerror = fin;
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    fin();
  }
}

// ---------- Validación de jugadores (Básico + RAE grande, plurales -> singular) ----------
async function verificarPalabraEnServidor(palabra) {
  await Promise.all([cargarDiccionarioBasico(), cargarDiccionarioRAE()]);
  const p = palabra.toLowerCase().trim();
  if (!p) return false;

  // 1. Si el jugador dijo un plural válido, devolver directamente su SINGULAR
  const singularDetectado = convertirPluralASingularLocal(p);
  if (singularDetectado) return singularDetectado;

  // 2. Coincidencia directa en diccionario básico o diccionario grande RAE
  const directa = buscarEnDiccionarioLocal(p);
  if (directa) return directa;

  if (setDiccionarioRAE) return false;

  // Respaldo online si ninguno de los diccionarios grandes cargó
  try {
    const singulares = EXCEPCIONES_NO_PLURAL.has(SinTildes(p)) ? [] : obtenerSingularesDePlural(p).map(c => c.word);
    for (const cand of [...singulares, p]) {
      const res = await fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(cand) + '&max=10&v=es');
      const data = await res.json();
      const match = data.find(item => SinTildes(item.word.toLowerCase()) === SinTildes(cand));
      if (match) return match.word.toLowerCase();
    }
    return false;
  } catch (e) {
    return p;
  }
}

// ---------- Selección de la máquina: PRIORIZA diccionario_basico.json ----------
async function obtenerPalabrasCandidatasMaquina(prefijoNormalizado) {
  await Promise.all([cargarDiccionarioBasico(), cargarDiccionarioRAE()]);

  // 1. Primero buscar palabras cotidianas del diccionario básico (todas con definición limpia offline)
  const basicas = arrayBasico.filter(p => {
    if (p.length < 3 || historialPalabras.includes(p)) return false;
    if (!SOLO_LETRAS.test(p)) return false;
    const silabas = silabear(p);
    return silabas.length >= 2 && normalizarSilaba(silabas[0]) === prefijoNormalizado;
  });
  if (basicas.length > 0) return basicas;

  // 2. Solo si no queda ninguna básica con esa sílaba, recurrir al diccionario grande (evitando plurales)
  if (arrayDiccionarioRAE) {
    const todas = arrayDiccionarioRAE.filter(p => {
      if (p.length < 3 || historialPalabras.includes(p)) return false;
      if (!SOLO_LETRAS.test(p)) return false;
      if (convertirPluralASingularLocal(p)) return false;
      const silabas = silabear(p);
      return silabas.length >= 2 && normalizarSilaba(silabas[0]) === prefijoNormalizado;
    });
    const comunes = todas.filter(p => p.length >= 4 && p.length <= 7);
    return comunes.length > 0 ? comunes : todas;
  }
  return [];
}

function silabear(palabra) {
  let p = palabra.toLowerCase().trim();
  const vocalesFuertes = 'aeoáéóíú';
  const inseparables = ['br','bl','cr','cl','dr','fr','fl','gr','gl','pr','pl','tr','ch','ll','rr'];
  let silabas = [];
  let silabaActual = "";
  const isVocal = (c) => 'aeiouáéíóúü'.includes(c);
  const isConsonante = (c) => c && !isVocal(c);

  for (let i = 0; i < p.length; i++) {
    let char = p[i];
    silabaActual += char;
    let next1 = p[i+1] || ''; let next2 = p[i+2] || ''; let next3 = p[i+3] || '';
    if (isVocal(char)) {
      if (isVocal(next1) && vocalesFuertes.includes(char) && vocalesFuertes.includes(next1)) {
        silabas.push(silabaActual); silabaActual = ""; continue;
      }
      if (isConsonante(next1)) {
        if (isVocal(next2)) {
          silabas.push(silabaActual); silabaActual = "";
        } else if (isConsonante(next2)) {
          if (isVocal(next3)) {
            let grupo = next1 + next2;
            if (inseparables.includes(grupo)) {
              silabas.push(silabaActual); silabaActual = "";
            } else {
              silabaActual += next1; silabas.push(silabaActual); silabaActual = ""; i++;
            }
          } else if (isConsonante(next3)) {
            let grupo = next2 + next3;
            if (inseparables.includes(grupo)) {
              silabaActual += next1; silabas.push(silabaActual); silabaActual = ""; i++;
            } else {
              silabaActual += next1 + next2; silabas.push(silabaActual); silabaActual = ""; i += 2;
            }
          }
        }
      }
    }
  }
  if (silabaActual !== "") {
    if (silabas.length > 0 && !/[aeiouáéíóúü]/.test(silabaActual)) {
      silabas[silabas.length - 1] += silabaActual;
    } else {
      silabas.push(silabaActual);
    }
  }
  const hardcoded = {
    'palabra': ['pa','la','bra'], 'brasa': ['bra','sa'], 'sapo': ['sa','po'],
    'pomo': ['po','mo'], 'mono': ['mo','no'], 'noto': ['no','to'],
    'tope': ['to','pe'], 'perro': ['pe','rro'], 'roca': ['ro','ca'],
    'carta': ['car','ta'], 'taco': ['ta','co'], 'camino': ['ca','mi','no'],
    'verano': ['ve','ra','no'], 'planeta': ['pla','ne','ta'], 'tesoro': ['te','so','ro'],
    'espejo': ['es','pe','jo'], 'castillo': ['cas','ti','llo'], 'naranja': ['na','ran','ja']
  };
  return hardcoded[p] || silabas;
}

function normalizarSilaba(silaba) {
  return (silaba || "")
    .toLowerCase()
    .replace(/ñ/g, "\u0001")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\u0001/g, "ñ")
    .replace(/rr/g, "r");
}

function iniciarJuegoTablero(esReinicio = false) {
  if (window._anuncioPantallaCompletaActivo) return;
  historialPalabras = [];
  gameBoard.innerHTML = '';

  const palabraInicial = palabrasArranque[Math.floor(Math.random() * palabrasArranque.length)];
  const silabasIniciales = silabear(palabraInicial);

  historialPalabras.push(palabraInicial);
  silabaObjetivo = silabasIniciales[silabasIniciales.length - 1];

  esTurnoMaquina = false;
  bloquearInputs(true);
  actualizarInterfazTurno("🔊 Presentando primera palabra...", "bg-amber-700");

    ? (nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1])
    : nombres[0];

  const fraseInicio = esReinicio
    ? ("¡Vamos otra vez! Primera palabra: " + palabraInicial + ".")
    : ("¡Hola " + listaSaludo + "! Primera palabra: " + palabraInicial + ".");

  hablar(fraseInicio, () => {
    mostrarTurnoHumano();
    bloquearInputs(false);
    arrancarRecon();
  });
}

async function juegaMaquina() {
  if (modoActual !== 'pve' || juegoTerminado || window._anuncioPantallaCompletaActivo) return;
  actualizarInterfazTurno("📚 Buscando palabra...", "bg-purple-500");

  const prefijo = normalizarSilaba(silabaObjetivo);
  const candidatas = await obtenerPalabrasCandidatasMaquina(prefijo);

  if (candidatas.length > 0) {
    const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
    await window.procesarEntrada(elegida, true);
  } else {
    actualizarInterfazTurno("¡Victoria de " + nombres[0] + "!", "bg-green-500");
    hablar("¡No me quedan palabras que empiecen por " + silabaParaVoz(silabaObjetivo) + "! ¡Has ganado, " + nombres[0] + "! Di otra vez para jugar de nuevo.", () => {
      mostrarFinJuego();
    });
  }
}

window.meRindo = async function() {
  if (esTurnoMaquina || textInput.disabled || juegoTerminado || window._anuncioPantallaCompletaActivo) return;
  bloquearInputs(true);

  const rindiente = nombres[jugadorActual];
  let textoGanador = (modoActual === 'pve')
    ? "¡Gana la máquina!"
    : (nombres.length === 2 ? ("¡Gana " + nombres[1 - jugadorActual] + "!") : ("¡Fin de la partida por rendición de " + rindiente + "!"));

  actualizarInterfazTurno("Buscando palabra válida...", "bg-red-500");

  hablar(rindiente + " se rinde. Buscando una palabra válida...", async () => {
    const prefijo = normalizarSilaba(silabaObjetivo);
    const candidatas = await obtenerPalabrasCandidatasMaquina(prefijo);

    if (candidatas.length > 0) {
      const elegida = candidatas[Math.floor(Math.random() * candidatas.length)];
      const silabasElegida = silabear(elegida);
      const explicacion = await obtenerExplicacionPalabra(elegida);

      historialPalabras.push(elegida);
      silabaObjetivo = silabasElegida[silabasElegida.length - 1];
      agregarPalabraUI(elegida, silabasElegida, false, 1, "💡 Esta valía", explicacion);
      actualizarInterfazTurno("🏆 " + textoGanador, "bg-green-600");

      const msgRecord = recordSuperadoEnPartida ? (" ¡Nuevo récord de " + recordPalabras + " palabras!") : "";
      let parteExp = "";
      if (explicacion.tipo === 'definicion') parteExp = " " + explicacion.texto;
      else if (explicacion.tipo === 'sinonimos') parteExp = " Sinónimos: " + explicacion.texto + ".";

      hablar("Podrías haber dicho: " + elegida + "." + parteExp + " " + textoGanador + msgRecord + " Di otra vez para reiniciar.", mostrarFinJuego);
    } else {
      actualizarInterfazTurno("🤝 Empate técnico", "bg-gray-600");
      hablar("No existía ninguna palabra con la sílaba " + silabaParaVoz(silabaObjetivo) + ". ¡Empate técnico! Di otra vez para reiniciar.", mostrarFinJuego);
    }
  });
};

function esPreguntaDeSignificado(texto) {
  const limpio = SinTildes((texto || "").toLowerCase().trim());
  return /(que significa|eso que es|que es eso|cual es su significado|cual es el significado|que quiere decir|significado|sinonimo|sinonimos)/.test(limpio);
}

window.procesarEntrada = async function(texto, esMaquina = false) {
  if (juegoTerminado || window._anuncioPantallaCompletaActivo) return;
  if (!esMaquina && (esTurnoMaquina || textInput.disabled || hablando)) return;

  const textoBruto = (texto || "").trim();
  if (!textoBruto) return;

  if (!esMaquina && esPreguntaDeSignificado(textoBruto)) {
    textInput.value = "";
    await responderSignificadoUltimaPalabra();
    return;
  }

  if (!esMaquina && /^otra vez$/i.test(textoBruto)) {
    textInput.value = "";
    mostrarAlerta("La orden «otra vez» solo funciona cuando acaba la partida.");
    hablar("La partida aún no ha terminado. Debe empezar por " + silabaParaVoz(silabaObjetivo) + ".");
    return;
  }

  const s2 = normalizarSilaba(silabaObjetivo);
  let palabra = normalizarTokenVoz(textoBruto, s2);
  if (!palabra) return;

  if (!SOLO_LETRAS.test(palabra)) {
    mostrarAlerta("Escribe una sola palabra, solo con letras.");
    textInput.value = "";
    return;
  }
  if (historialPalabras.includes(palabra)) {
    mostrarAlerta("La palabra '" + palabra + "' ya se ha usado.");
    textInput.value = "";
    hablar("La palabra " + palabra + " ya se ha usado. Prueba con otra.");
    return;
  }

  bloquearInputs(true);
  textInput.value = "";

  let silabasWord = silabear(palabra);
  let s1 = normalizarSilaba(silabasWord[0]);

  let jugadaValida = false;
  let vozError = "";
  if (s1 !== s2) {
    mostrarAlerta("¡Error! Debe empezar por '" + silabaObjetivo.toUpperCase() + "', no por '" + silabasWord[0] + "'.");
    vozError = palabra + ", no. Debe empezar por " + silabaParaVoz(silabaObjetivo) + ", no por " + silabaParaVoz(silabasWord[0]) + ". Inténtalo otra vez.";
  } else if (esMaquina) {
    jugadaValida = true;
  } else {
    actualizarInterfazTurno("Consultando diccionario...", "bg-yellow-500");
    const formaValida = await verificarPalabraEnServidor(palabra);
    if (formaValida && typeof formaValida === 'string') {
      if (historialPalabras.includes(formaValida)) {
        mostrarAlerta("La palabra '" + formaValida + "' ya se ha usado.");
        vozError = "La palabra " + formaValida + " ya se ha usado. Prueba con otra.";
      } else {
        palabra = formaValida;
        silabasWord = silabear(palabra);
        jugadaValida = true;
      }
    } else {
      mostrarAlerta("'" + palabra + "' no está en el diccionario.");
      vozError = palabra + " no viene en el diccionario. Inténtalo otra vez.";
    }
  }

  if (!jugadaValida) {
    mostrarTurnoHumano();
    bloquearInputs(false);
    hablar(vozError, () => arrancarRecon());
    return;
  }

  const previoRecord = recordPalabras;
  incrementarContadorPalabras();
  const etiquetaRecord = (contadorPalabras > previoRecord && previoRecord > 0) ? "🔥 ¡Nuevo Récord!" : "";

  historialPalabras.push(palabra);
  silabaObjetivo = silabasWord[silabasWord.length - 1];

  const indiceColor = esMaquina ? 1 : jugadorActual;
  agregarPalabraUI(palabra, silabasWord, false, indiceColor, etiquetaRecord);

  if (modoActual === 'pve') {
    if (esMaquina) {
      hablar(palabra, () => {
        esTurnoMaquina = false;
        mostrarTurnoHumano();
        bloquearInputs(false);
        arrancarRecon();
      });
    } else {
      esTurnoMaquina = true;
      actualizarInterfazTurno("🤖 Máquina pensando...", "bg-purple-500");
      const coletilla = coletillas[Math.floor(Math.random() * coletillas.length)];
      hablar(palabra + ". " + coletilla, () => {
        setTimeout(juegaMaquina, 400);
      });
    }
  } else {
    jugadorActual = (jugadorActual + 1) % nombres.length;
    hablar(palabra, () => {
      mostrarTurnoHumano();
      bloquearInputs(false);
      arrancarRecon();
    });
  }
};

function uiMic(encendido) {

function procesarFraseVoz(rawInput) {
  if (modoActual === "" || hablando || window._anuncioPantallaCompletaActivo || Date.now() < ignorarVozHasta) return;
  const alternativas = (rawInput || "").split('|').map(s => s.trim().toLowerCase()).filter(Boolean);
  if (alternativas.length === 0) return;

  if (juegoTerminado) {
    for (const alt of alternativas) {
      if (/\b(otra vez|jugar otra vez|otra partida)\b/.test(alt)) {
        window.reiniciarMismaPartida();
        return;
      }
    }
    return;
  }

  if (esTurnoMaquina || textInput.disabled) return;

  for (const alt of alternativas) {
    if (/^(otra vez|jugar otra vez)$/.test(alt)) {
      mostrarAlerta("«Otra vez» solo funciona cuando acaba la partida.");
      hablar("La orden otra vez solo funciona cuando haya acabado la partida. Te toca con " + silabaParaVoz(silabaObjetivo) + ".");
      return;
    }
  }

  for (const alt of alternativas) {
    if (esPreguntaDeSignificado(alt)) {
      responderSignificadoUltimaPalabra();
      return;
    }
  }

  for (const alt of alternativas) {
    if (/\b(me rindo|rindo|rendirse)\b/.test(alt)) {
      window.meRindo();
      return;
    }
  }

  const sObj = normalizarSilaba(silabaObjetivo);

  if (historialPalabras.length === 1 && sObj !== 'o' && sObj !== 'ho') {
    const limpioInicial = normalizarTokenVoz(alternativas[0].split(/\s+/)[0], sObj);
    if (limpioInicial === 'hola' || limpioInicial === 'primera') return;
  }

  let mejorPalabra = null;
  for (const alt of alternativas) {
    const primera = normalizarTokenVoz(alt.split(/\s+/)[0], sObj);
    if (primera && SOLO_LETRAS.test(primera)) {
      const sils = silabear(primera);
      if (sils.length > 0 && normalizarSilaba(sils[0]) === sObj) {
        mejorPalabra = primera;
        break;
      }
    }
  }

  if (!mejorPalabra) {
    mejorPalabra = normalizarTokenVoz(alternativas[0].split(/\s+/)[0], sObj);
  }
  if (mejorPalabra) {
    window.procesarEntrada(mejorPalabra);
  }
}

try {
  if (window.AndroidVoice) {
    recon = {
      start() { window.AndroidVoice.startListening(); },
      stop() { window.AndroidVoice.stopListening(); },
      abort() { window.AndroidVoice.stopListening(); }
    };
    window._onNativeSrStart = () => {
      if (hablando || window._anuncioPantallaCompletaActivo) {
        pausarReconocimientoMientrasHabla();
        return;
      }
      isListening = true;
      uiMic(true);
    };
    window._onNativeSrResult = (frase) => { procesarFraseVoz(frase); };
    window._onNativeSrError = (err) => {
      isListening = false;
      if (err === 'not-allowed') {
        micDeseado = false;
        uiMic(false);
        micStatus.textContent = "Permiso de micrófono denegado";
      }
    };
    window._onNativeSrEnd = () => {
      isListening = false;
      if (micDeseado && modoActual !== "" && !hablando && !window._anuncioPantallaCompletaActivo) setTimeout(arrancarRecon, 350);
      else if (!micDeseado) uiMic(false);
    };
  } else if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recon = new SpeechRecognition();
    recon.lang = 'es-ES';
    recon.continuous = true;
    recon.interimResults = false;
    recon.maxAlternatives = 5;
    recon.onstart = () => {
      if (hablando || window._anuncioPantallaCompletaActivo) {
        pausarReconocimientoMientrasHabla();
        return;
      }
      isListening = true;
      uiMic(true);
    };
    recon.onresult = (event) => {
      if (hablando || window._anuncioPantallaCompletaActivo || Date.now() < ignorarVozHasta) return;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (!result.isFinal) continue;
        const alts = [];
        for (let j = 0; j < result.length; j++) alts.push(result[j].transcript);
        procesarFraseVoz(alts.join('|'));
      }
    };
    recon.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        if (document.visibilityState !== 'visible') return;
        micDeseado = false;
        uiMic(false);
        micStatus.textContent = "Permiso de micrófono denegado";
      }
    };
    recon.onend = () => {
      isListening = false;
      if (micDeseado && modoActual !== "" && !hablando && !window._anuncioPantallaCompletaActivo) {
        micStatus.textContent = "Reconectando micrófono...";
        setTimeout(arrancarRecon, 300);
      } else if (!micDeseado) {
        uiMic(false);
      }
    };
  } else {
    micStatus.textContent = "Voz no soportada";
    micBtn.disabled = true;
    micBtn.classList.replace('bg-blue-500', 'bg-gray-400');
  }
} catch (e) {}

setInterval(() => {
  if (micDeseado && !isListening && !hablando && !window._anuncioPantallaCompletaActivo && modoActual !== "" && document.visibilityState === 'visible') {
    arrancarRecon();
  }
}, 2500);

function arrancarRecon(intentos = 0) {
  if (!recon || !micDeseado || isListening || hablando || window._anuncioPantallaCompletaActivo || modoActual === "") return;
  try {
    recon.start();
  } catch (err) {
    if (intentos < 20) setTimeout(() => arrancarRecon(intentos + 1), 300);
  }
}

function iniciarMicrofono() {
  if (!recon || modoActual === "") return;
  micDeseado = true;
  if (!hablando && !window._anuncioPantallaCompletaActivo) arrancarRecon();
}

window.alternarMicrofono = function() {
  if (window._anuncioPantallaCompletaActivo) return;
  if (micDeseado) detenerMicrofono();
  else iniciarMicrofono();
};

function detenerMicrofono() {
  micDeseado = false;
  isListening = false;
  try { if (recon) recon.stop(); } catch (e) {}
  uiMic(false);
}

pedirWakeLock();
</script>

<script>
(function initAdMob() {
  try {
    const cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;

    const callAdMob = (method, options = {}) => {
      if (cap.Plugins && cap.Plugins.AdMob && typeof cap.Plugins.AdMob[method] === 'function') {
        return cap.Plugins.AdMob[method](options);
      }
      if (typeof cap.nativePromise === 'function') {
        return cap.nativePromise('AdMob', method, options);
      }
      return Promise.reject('AdMob plugin no disponible');
    };

    document.body.style.paddingBottom = '64px';

    const BANNER_ID = 'ca-app-pub-6672720525194990/4222281539';
    const INTERSTITIAL_ID = 'ca-app-pub-6672720525194990/1155079157';
    let interstitialReady = false;

    async function preloadInterstitial() {
      try {
        await callAdMob('prepareInterstitial', { adId: INTERSTITIAL_ID, isTesting: false });
        interstitialReady = true;
      } catch (e) {
        try {
          await callAdMob('prepareInterstitial', { adId: INTERSTITIAL_ID, isTesting: true });
          interstitialReady = true;
        } catch (e2) { interstitialReady = false; }
      }
    }

    async function showInterstitialThen(callback) {
      if (window._anuncioPantallaCompletaActivo) return;
      if (!interstitialReady) {
        preloadInterstitial();
        if (callback) callback();
        return;
      }

      window._anuncioPantallaCompletaActivo = true;
      if (typeof window.pausarTodoParaAnuncio === 'function') {
        window.pausarTodoParaAnuncio();
      }

      let resuelto = false;
      let anuncioMostrado = false;
      let listeners = [];
      let safetyTimer = null;
      let returnTimer = null;

      const limpiar = () => {
        clearTimeout(safetyTimer);
        clearTimeout(returnTimer);
        document.removeEventListener('visibilitychange', onVisChange);
        listeners.forEach(l => {
          try { if (l && typeof l.remove === 'function') l.remove(); } catch (e) {}
        });
        listeners = [];
      };

      const finalizarAnuncio = () => {
        if (resuelto) return;
        resuelto = true;
        limpiar();
        interstitialReady = false;
        window._anuncioPantallaCompletaActivo = false;
        preloadInterstitial();
        setTimeout(() => {
          if (callback) callback();
        }, 350);
      };

      const onVisChange = () => {
        if (anuncioMostrado && document.visibilityState === 'visible') {
          clearTimeout(returnTimer);
          returnTimer = setTimeout(finalizarAnuncio, 1200);
        }
      };
      document.addEventListener('visibilitychange', onVisChange);

      try {
        const admob = cap.Plugins && cap.Plugins.AdMob;
        if (admob && typeof admob.addListener === 'function') {
          listeners.push(await admob.addListener('interstitialAdShowed', () => {
            anuncioMostrado = true;
            clearTimeout(safetyTimer);
          }));
          listeners.push(await admob.addListener('interstitialAdDismissed', () => {
            finalizarAnuncio();
          }));
          listeners.push(await admob.addListener('interstitialAdFailedToShow', () => {
            finalizarAnuncio();
          }));
        }

        safetyTimer = setTimeout(() => {
          if (!anuncioMostrado) finalizarAnuncio();
        }, 4000);

        await callAdMob('showInterstitial', {});

        if (listeners.length === 0) {
          finalizarAnuncio();
        }
      } catch (e) {
        finalizarAnuncio();
      }
    }

    window.addEventListener('load', async () => {
      try {
        await callAdMob('initialize', { initializeForTesting: false });
        try {
          await callAdMob('showBanner', {
            adId: BANNER_ID,
            adSize: 'ADAPTIVE_BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: false
          });
        } catch (errReal) {
          await callAdMob('showBanner', {
            adId: BANNER_ID,
            adSize: 'ADAPTIVE_BANNER',
            position: 'BOTTOM_CENTER',
            margin: 0,
            isTesting: true
          });
        }
        await preloadInterstitial();
      } catch (e) {}
    });

    const origReiniciar = window.reiniciarMismaPartida;
    window.reiniciarMismaPartida = function() {
      showInterstitialThen(() => origReiniciar());
    };
  } catch (e) {}
})();
</script>
