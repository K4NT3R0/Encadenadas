name: Fabricar App Encadenadas

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java 21 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar Diccionario Castellano RAE optimizado y preparar imagenes
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6 sharp

          cat << 'EOF' > prepare.js
          const fs = require('fs');
          const https = require('https');
          const sharp = require('sharp');

          function downloadText(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(downloadText(res.headers.location));
                }
                if (res.statusCode !== 200) return reject(new Error('HTTP ' + res.statusCode));
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function run() {
            const urls = [
              'https://raw.githubusercontent.com/javierarce/palabras/master/listado-general.txt',
              'https://raw.githubusercontent.com/JorgeDuenasLerin/diccionario-espanol-txt/master/0_palabras_todas.txt'
            ];
            let rawText = '';
            for (const u of urls) {
              try {
                rawText = await downloadText(u);
                if (rawText && rawText.length > 50000) break;
              } catch (e) {}
            }

            const extras = ['jota', 'palabra', 'brasa', 'sapo', 'pomo', 'mono', 'dócil', 'jocoso', 'soñando'];
            const regex = /^[a-záéíóúüñ]{2,14}$/;
            const wordsSet = new Set(extras);

            if (rawText) {
              for (const line of rawText.split(/\r?\n/)) {
                const w = line.trim().toLowerCase();
                if (regex.test(w)) wordsSet.add(w);
                if (wordsSet.size >= 95000) break;
              }
            }

            const wordArray = Array.from(wordsSet);
            fs.writeFileSync('diccionario.json', JSON.stringify(wordArray));

            const iconSrc = ['31541.png', '31341.png', 'icon-512.png', 'icon-192.png'].find(f => fs.existsSync(f));
            const splashSrc = ['31336.png', 'splash.png'].find(f => fs.existsSync(f)) || iconSrc;

            await sharp(iconSrc).resize(192, 192).png().toFile('icon-192.png');
            await sharp(iconSrc).resize(512, 512).png().toFile('icon-512.png');
            await sharp(iconSrc).resize(512, 512).png().toFile('icon-maskable-512.png');
            await sharp(splashSrc).png().toFile('splash.png');

            fs.mkdirSync('www', { recursive: true });
            for (const f of ['index.html', 'manifest.json', 'sw.js', 'diccionario.json', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png', 'splash.png', '31541.png', '31336.png']) {
              if (fs.existsSync(f)) fs.copyFileSync(f, 'www/' + f);
            }
          }
          run().catch(err => { console.error(err); process.exit(1); });
          EOF

          node prepare.js
          npx cap init "Encadenadas" "com.k4nt3r0.encadenadas" --web-dir www
          npx cap add android

          cat << 'EOF' > inject-android-icons.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function inject() {
            const resDir = 'android/app/src/main/res';
            for (const dirName of ['drawable-anydpi-v24', 'mipmap-anydpi-v26']) {
              const p = path.join(resDir, dirName);
              if (fs.existsSync(p)) fs.rmSync(p, { recursive: true, force: true });
            }
            const anyDpi = path.join(resDir, 'mipmap-anydpi-v26');
            fs.mkdirSync(anyDpi, { recursive: true });
            const adaptiveXml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>';
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher.xml'), adaptiveXml);
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher_round.xml'), adaptiveXml);

            const valuesDir = path.join(resDir, 'values');
            fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(path.join(valuesDir, 'ic_launcher_background.xml'),
              '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#E6B981</color></resources>'
            );

            const mipmaps = [
              { folder: 'mipmap-mdpi', size: 48, fg: 108 },
              { folder: 'mipmap-hdpi', size: 72, fg: 162 },
              { folder: 'mipmap-xhdpi', size: 96, fg: 216 },
              { folder: 'mipmap-xxhdpi', size: 144, fg: 324 },
              { folder: 'mipmap-xxxhdpi', size: 192, fg: 432 }
            ];

            for (const m of mipmaps) {
              const dir = path.join(resDir, m.folder);
              fs.mkdirSync(dir, { recursive: true });
              await sharp('icon-512.png').resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp('icon-512.png').resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher_round.png'));
              const innerSize = Math.round(m.fg * 0.70);
              const innerBuf = await sharp('icon-512.png').resize(innerSize, innerSize).png().toBuffer();
              await sharp({ create: { width: m.fg, height: m.fg, channels: 4, background: { r: 230, g: 185, b: 129, alpha: 1 } } })
                .composite([{ input: innerBuf, gravity: 'center' }])
                .png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }

            const files = fs.readdirSync(resDir);
            for (const f of files) {
              if (f.startsWith('drawable')) {
                const splashTarget = path.join(resDir, f, 'splash.png');
                if (fs.existsSync(splashTarget) || f === 'drawable') {
                  await sharp('splash.png').resize(1080, 1920, { fit: 'cover' }).png().toFile(splashTarget);
                }
              }
            }
          }
          inject().catch(err => { console.error(err); process.exit(1); });
          EOF

          node inject-android-icons.js

      - name: Forzar MinSdk 24 en build.gradle y Configurar Permisos
        run: |
          # Modificar directamente android/app/build.gradle para asegurar minSdkVersion = 24
          APP_GRADLE="android/app/build.gradle"
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' "$APP_GRADLE"
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' "$APP_GRADLE"
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$APP_GRADLE"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.RECORD_AUDIO" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries></manifest>|g' "$MANIFEST"
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6672720525194990~2961170754"/><meta-data android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT" android:value="false"/></application>|g' "$MANIFEST"

          cat << 'EOF' > android/app/src/main/java/com/k4nt3r0/encadenadas/MainActivity.java
          package com.k4nt3r0.encadenadas;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {
              private TextToSpeech tts;
              private SpeechRecognizer sr;
              private Intent srIntent;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("es", "ES"));
                      }
                  });
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) {}
                      @Override public void onDone(String id) { evalJs("window._onNativeTtsDone && window._onNativeTtsDone()"); }
                      @Override public void onError(String id) { evalJs("window._onNativeTtsDone && window._onNativeTtsDone()"); }
                  });

                  srIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  srIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  srIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-ES");
                  srIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);

                  getBridge().getWebView().addJavascriptInterface(new NativeVoiceBridge(), "AndroidVoice");
              }

              private void evalJs(final String js) {
                  mainHandler.post(() -> {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(js, null);
                      }
                  });
              }

              public class NativeVoiceBridge {
                  @JavascriptInterface
                  public void speak(final String text) {
                      mainHandler.post(() -> {
                          if (tts != null) {
                              Bundle params = new Bundle();
                              tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, "utt_" + System.currentTimeMillis());
                          } else {
                              evalJs("window._onNativeTtsDone && window._onNativeTtsDone()");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopSpeak() {
                      mainHandler.post(() -> {
                          if (tts != null) tts.stop();
                      });
                  }

                  @JavascriptInterface
                  public void startListening() {
                      mainHandler.post(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                              evalJs("window._onNativeSrError && window._onNativeSrError('not-allowed')");
                              return;
                          }
                          try {
                              if (sr == null) {
                                  sr = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                                  sr.setRecognitionListener(new RecognitionListener() {
                                      @Override public void onReadyForSpeech(Bundle params) { evalJs("window._onNativeSrStart && window._onNativeSrStart()"); }
                                      @Override public void onBeginningOfSpeech() {}
                                      @Override public void onRmsChanged(float rmsdB) {}
                                      @Override public void onBufferReceived(byte[] buffer) {}
                                      @Override public void onEndOfSpeech() {}
                                      @Override public void onError(int error) { evalJs("window._onNativeSrEnd && window._onNativeSrEnd()"); }
                                      @Override public void onResults(Bundle results) {
                                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                          if (matches != null && !matches.isEmpty()) {
                                              StringBuilder sb = new StringBuilder();
                                              for (int i = 0; i < matches.size(); i++) {
                                                  if (i > 0) sb.append("|");
                                                  sb.append(matches.get(i));
                                              }
                                              String phrase = sb.toString().replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                                              evalJs("window._onNativeSrResult && window._onNativeSrResult('" + phrase + "')");
                                          }
                                          evalJs("window._onNativeSrEnd && window._onNativeSrEnd()");
                                      }
                                      @Override public void onPartialResults(Bundle partialResults) {}
                                      @Override public void onEvent(int eventType, Bundle params) {}
                                  });
                              }
                              sr.startListening(srIntent);
                          } catch (Exception e) {
                              evalJs("window._onNativeSrEnd && window._onNativeSrEnd()");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopListening() {
                      mainHandler.post(() -> {
                          try {
                              if (sr != null) {
                                  sr.stopListening();
                                  sr.cancel();
                              }
                          } catch (Exception e) {}
                      });
                  }
              }

              @Override
              public void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (sr != null) { sr.destroy(); }
                  super.onDestroy();
              }
          }
          EOF

          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle
          npx cap sync android

      - name: Preparar Llave Digital y Compilar APK + AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEY_PASSWORD:-MiCuadrante2026!}"
          KS_PATH="$PWD/android/app/release.keystore"
          rm -f "$KS_PATH"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d -i > "$KS_PATH" || true
          fi

          if ! keytool -list -keystore "$KS_PATH" -storepass "$PASS" -alias micuadrante >/dev/null 2>&1; then
            rm -f "$KS_PATH"
            keytool -genkeypair -v -keystore "$KS_PATH" -alias micuadrante -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=K4NT3R0, OU=Apps, O=K4NT3R0, L=Cadiz, S=Andalucia, C=ES"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KS_PATH" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=micuadrante \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Subir APK listo para instalar en el movil
        uses: actions/upload-artifact@v4
        with:
          name: Encadenadas-APK-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir AAB FIRMADO para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Encadenadas-GooglePlay-AAB-FIRMADO
          path: android/app/build/outputs/bundle/release/app-release.aab
