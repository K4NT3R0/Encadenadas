name: Fabricar App Encadenadas

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java 21 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar Diccionario Castellano ampliado y preparar imagenes
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6 sharp

          cat << 'EOF' > prepare.js
          const fs = require('fs');
          const https = require('https');
          const sharp = require('sharp');

          function downloadText(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return resolve(downloadText(res.headers.location));
                }
                if (res.statusCode !== 200) return reject(new Error('HTTP ' + res.statusCode));
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function run() {
            const primaryUrls = [
              'https://raw.githubusercontent.com/javierarce/palabras/master/listado-general.txt',
              'https://raw.githubusercontent.com/JorgeDuenasLerin/diccionario-espanol-txt/master/0_palabras_todas_no_conjugaciones.txt'
            ];
            const fallbackUrl = 'https://raw.githubusercontent.com/JorgeDuenasLerin/diccionario-espanol-txt/master/0_palabras_todas.txt';

            const extras = [
              'jota', 'palabra', 'brasa', 'sapo', 'pomo', 'mono', 'dócil', 'jocoso',
              'soñando', 'caliza', 'calizo', 'derbi', 'loca', 'oleoso', 'riolada',
              'binario', 'doblada', 'ciática', 'riojano', 'carea'
            ];
            const regex = /^[a-záéíóúüñ]{2,16}$/;
            const wordsSet = new Set(extras);

            let loadedLists = 0;
            for (const u of primaryUrls) {
              try {
                const txt = await downloadText(u);
                if (txt && txt.length > 50000) {
                  loadedLists++;
                  for (const line of txt.split(/\r?\n/)) {
                    const w = line.trim().toLowerCase();
                    if (regex.test(w)) wordsSet.add(w);
                  }
                }
              } catch (e) {
                console.log('Aviso descargando ' + u + ':', e.message);
              }
            }

            if (loadedLists < 2 || wordsSet.size < 110000) {
              try {
                const txtFull = await downloadText(fallbackUrl);
                if (txtFull && txtFull.length > 50000) {
                  for (const line of txtFull.split(/\r?\n/)) {
                    const w = line.trim().toLowerCase();
                    if (regex.test(w)) wordsSet.add(w);
                  }
                }
              } catch (e) {
                console.log('Aviso respaldo:', e.message);
              }
            }

            if (fs.existsSync('diccionario_basico.json')) {
              try {
                const basico = JSON.parse(fs.readFileSync('diccionario_basico.json', 'utf8'));
                for (const k of Object.keys(basico)) {
                  const w = k.trim().toLowerCase();
                  if (regex.test(w)) wordsSet.add(w);
                }
              } catch (e) {}
            }

            const wordArray = Array.from(wordsSet);
            console.log('Total palabras compiladas en diccionario.json:', wordArray.length);
            fs.writeFileSync('diccionario.json', JSON.stringify(wordArray));

            const iconSrc = ['31541.png', '31341.png', 'icon-512.png', 'icon-192.png'].find(f => fs.existsSync(f));
            const splashSrc = ['31336.png', 'splash.png'].find(f => fs.existsSync(f)) || iconSrc;

            await sharp(iconSrc).resize(192, 192).png().toFile('icon-192.png');
            await sharp(iconSrc).resize(512, 512).png().toFile('icon-512.png');
            await sharp(iconSrc).resize(512, 512).png().toFile('icon-maskable-512.png');
            await sharp(splashSrc).png().toFile('splash.png');

            fs.mkdirSync('www', { recursive: true });
            for (const f of ['index.html', 'manifest.json', 'sw.js', 'diccionario.json', 'diccionario_basico.json', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png', 'splash.png', '31541.png', '31336.png']) {
              if (fs.existsSync(f)) fs.copyFileSync(f, 'www/' + f);
            }
          }
          run().catch(err => { console.error(err); process.exit(1); });
          EOF

          node prepare.js
          npx cap init "Encadenadas" "com.k4nt3r0.encadenadas" --web-dir www
          npx cap add android

          cat << 'EOF' > inject-android-icons.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function inject() {
            const resDir = 'android/app/src/main/res';
            for (const dirName of ['drawable-anydpi-v24', 'mipmap-anydpi-v26']) {
              const p = path.join(resDir, dirName);
              if (fs.existsSync(p)) fs.rmSync(p, { recursive: true, force: true });
            }
            const anyDpi = path.join(resDir, 'mipmap-anydpi-v26');
            fs.mkdirSync(anyDpi, { recursive: true });
            const adaptiveXml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>';
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher.xml'), adaptiveXml);
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher_round.xml'), adaptiveXml);

            const valuesDir = path.join(resDir, 'values');
            fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(path.join(valuesDir, 'ic_launcher_background.xml'),
              '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#E6B981</color></resources>'
            );

            const mipmaps = [
              { folder: 'mipmap-mdpi', size: 48, fg: 108 },
              { folder: 'mipmap-hdpi', size: 72, fg: 162 },
              { folder: 'mipmap-xhdpi', size: 96, fg: 216 },
              { folder: 'mipmap-xxhdpi', size: 144, fg: 324 },
              { folder: 'mipmap-xxxhdpi', size: 192, fg: 432 }
            ];

            for (const m of mipmaps) {
              const dir = path.join(resDir, m.folder);
              fs.mkdirSync(dir, { recursive: true });
              await sharp('icon-512.png').resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp('icon-512.png').resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher_round.png'));
              const innerSize = Math.round(m.fg * 0.70);
              const innerBuf = await sharp('icon-512.png').resize(innerSize, innerSize).png().toBuffer();
              await sharp({ create: { width: m.fg, height: m.fg, channels: 4, background: { r: 230, g: 185, b: 129, alpha: 1 } } })
                .composite([{ input: innerBuf, gravity: 'center' }])
                .png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }

            const files = fs.readdirSync(resDir);
            for (const f of files) {
              if (f.startsWith('drawable')) {
                const splashTarget = path.join(resDir, f, 'splash.png');
                if (fs.existsSync(splashTarget) || f === 'drawable') {
                  await sharp('splash.png').resize(1080, 1920, { fit: 'cover' }).png().toFile(splashTarget);
                }
              }
            }
          }
          inject().catch(err => { console.error(err); process.exit(1); });
          EOF

          node inject-android-icons.js

      - name: Configurar SDK 24 y API 36 en variables.gradle y Permisos
        run: |
          npx cap sync android

          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' android/variables.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.WAKE_LOCK" /><uses-permission android:name="com.google.android.gms.permission.AD_ID" /><queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries></manifest>|g' "$MANIFEST"
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6672720525194990~2961170754"/><meta-data android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT" android:value="false"/></application>|g' "$MANIFEST"

          cat << 'EOF' > android/app/src/main/java/com/k4nt3r0/encadenadas/MainActivity.java
          package com.k4nt3r0.encadenadas;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends BridgeActivity {
              private TextToSpeech tts;
              private SpeechRecognizer sr;
              private Intent srIntent;
              private AudioManager audioManager;
              private boolean mutedMusic = false;
              private boolean mutedNotification = false;
              private boolean mutedSystem = false;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final Runnable restoreAudioRunnable = this::restoreAudioStreams;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }

                  initTts();

                  srIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  srIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  srIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-ES");
                  srIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);

                  getBridge().getWebView().addJavascriptInterface(new NativeVoiceBridge(), "AndroidVoice");
              }

              private void initTts() {
                  if (tts != null) return;
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(new Locale("es", "ES"));
                      }
                  });
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) {}
                      @Override public void onDone(String id) { evalJs("window._onNativeTtsDone && window._onNativeTtsDone()"); }
                      @Override public void onError(String id) { evalJs("window._onNativeTtsDone && window._onNativeTtsDone()"); }
                  });
              }

              private void destroyRecognizer() {
                  if (sr != null) {
                      try { sr.stopListening(); } catch (Exception e) {}
                      try { sr.cancel(); } catch (Exception e) {}
                      try { sr.destroy(); } catch (Exception e) {}
                      sr = null;
                  }
              }

              private void muteRecognizerBeeps() {
                  if (audioManager == null) return;
                  mainHandler.removeCallbacks(restoreAudioRunnable);

                  try {
                      if (!mutedMusic && !audioManager.isStreamMute(AudioManager.STREAM_MUSIC)) {
                          audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, 0);
                          mutedMusic = true;
                      }
                  } catch (Exception e) {}

                  try {
                      if (!mutedNotification && !audioManager.isStreamMute(AudioManager.STREAM_NOTIFICATION)) {
                          audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                          mutedNotification = true;
                      }
                  } catch (Exception e) {}

                  try {
                      if (!mutedSystem && !audioManager.isStreamMute(AudioManager.STREAM_SYSTEM)) {
                          audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_MUTE, 0);
                          mutedSystem = true;
                      }
                  } catch (Exception e) {}
              }

              private void restoreAudioStreams() {
                  if (audioManager == null) return;
                  mainHandler.removeCallbacks(restoreAudioRunnable);

                  if (mutedMusic) {
                      try { audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) {}
                      mutedMusic = false;
                  }
                  if (mutedNotification) {
                      try { audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) {}
                      mutedNotification = false;
                  }
                  if (mutedSystem) {
                      try { audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) {}
                      mutedSystem = false;
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  restoreAudioStreams();
              }

              @Override
              public void onPause() {
                  destroyRecognizer();
                  restoreAudioStreams();
                  super.onPause();
              }

              private void evalJs(final String js) {
                  mainHandler.post(() -> {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().evaluateJavascript(js, null);
                      }
                  });
              }

              public class NativeVoiceBridge {
                  @JavascriptInterface
                  public void resetAudio() {
                      mainHandler.post(() -> {
                          destroyRecognizer();
                          restoreAudioStreams();
                          try {
                              if (audioManager != null) {
                                  audioManager.setMode(AudioManager.MODE_NORMAL);
                                  audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0);
                              }
                          } catch (Exception e) {}
                          initTts();
                      });
                  }

                  @JavascriptInterface
                  public void speak(final String text) {
                      mainHandler.post(() -> {
                          try {
                              if (sr != null) {
                                  sr.stopListening();
                                  sr.cancel();
                              }
                          } catch (Exception e) {}

                          restoreAudioStreams();
                          try {
                              if (audioManager != null) {
                                  audioManager.setMode(AudioManager.MODE_NORMAL);
                                  audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_UNMUTE, 0);
                              }
                          } catch (Exception e) {}

                          initTts();
                          if (tts != null) {
                              Bundle params = new Bundle();
                              params.putInt(TextToSpeech.Engine.KEY_PARAM_STREAM, AudioManager.STREAM_MUSIC);
                              int res = tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, "utt_" + System.currentTimeMillis());
                              if (res == TextToSpeech.ERROR) {
                                  evalJs("window._onNativeTtsDone && window._onNativeTtsDone()");
                              }
                          } else {
                              evalJs("window._onNativeTtsDone && window._onNativeTtsDone()");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopSpeak() {
                      mainHandler.post(() -> {
                          if (tts != null) tts.stop();
                      });
                  }

                  @JavascriptInterface
                  public void startListening() {
                      mainHandler.post(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                              evalJs("window._onNativeSrError && window._onNativeSrError('not-allowed')");
                              return;
                          }
                          try {
                              if (sr == null) {
                                  sr = SpeechRecognizer.createSpeechRecognizer(MainActivity.this);
                                  sr.setRecognitionListener(new RecognitionListener() {
                                      @Override public void onReadyForSpeech(Bundle params) { evalJs("window._onNativeSrStart && window._onNativeSrStart()"); }
                                      @Override public void onBeginningOfSpeech() {}
                                      @Override public void onRmsChanged(float rmsdB) {}
                                      @Override public void onBufferReceived(byte[] buffer) {}
                                      @Override public void onEndOfSpeech() {}
                                      @Override public void onError(int error) {
                                          if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY || error == SpeechRecognizer.ERROR_CLIENT) {
                                              destroyRecognizer();
                                          }
                                          evalJs("window._onNativeSrEnd && window._onNativeSrEnd()");
                                      }
                                      @Override public void onResults(Bundle results) {
                                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                          if (matches != null && !matches.isEmpty()) {
                                              StringBuilder sb = new StringBuilder();
                                              for (int i = 0; i < matches.size(); i++) {
                                                  if (i > 0) sb.append("|");
                                                  sb.append(matches.get(i));
                                              }
                                              String phrase = sb.toString().replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ");
                                              evalJs("window._onNativeSrResult && window._onNativeSrResult('" + phrase + "')");
                                          }
                                          evalJs("window._onNativeSrEnd && window._onNativeSrEnd()");
                                      }
                                      @Override public void onPartialResults(Bundle partialResults) {}
                                      @Override public void onEvent(int eventType, Bundle params) {}
                                  });
                              }
                              muteRecognizerBeeps();
                              sr.startListening(srIntent);
                          } catch (Exception e) {
                              destroyRecognizer();
                              restoreAudioStreams();
                              evalJs("window._onNativeSrEnd && window._onNativeSrEnd()");
                          }
                      });
                  }

                  @JavascriptInterface
                  public void stopListening() {
                      mainHandler.post(() -> {
                          try {
                              if (sr != null) {
                                  sr.stopListening();
                                  sr.cancel();
                              }
                          } catch (Exception e) {}
                          mainHandler.removeCallbacks(restoreAudioRunnable);
                          mainHandler.postDelayed(restoreAudioRunnable, 400);
                      });
                  }
              }

              @Override
              public void onDestroy() {
                  restoreAudioStreams();
                  if (tts != null) { tts.stop(); tts.shutdown(); tts = null; }
                  destroyRecognizer();
                  super.onDestroy();
              }
          }
          EOF

          VC=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode 1/versionCode $VC/g" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.${{ github.run_number }}"/g' android/app/build.gradle

      - name: Preparar Llave Digital Fija, Certificado PEM y Compilar APK + AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEY_PASSWORD:-MiCuadrante2026!}"
          KS_PATH="$PWD/android/app/release.keystore"
          rm -f "$KS_PATH"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d -i > "$KS_PATH" || true
          elif [ -f "release.keystore" ]; then
            cp release.keystore "$KS_PATH"
          fi

          if ! keytool -list -keystore "$KS_PATH" -storepass "$PASS" -alias micuadrante >/dev/null 2>&1; then
            rm -f "$KS_PATH"
            keytool -genkeypair -v -keystore "$KS_PATH" -alias micuadrante -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=K4NT3R0, OU=Apps, O=K4NT3R0, L=Cadiz, S=Andalucia, C=ES"
            cp "$KS_PATH" release.keystore
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add release.keystore
            git commit -m "Guardar clave de firma permanente [skip ci]" || true
            git push || true
          fi

          keytool -export -rfc -keystore "$KS_PATH" -alias micuadrante -file upload_certificate.pem -storepass "$PASS"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KS_PATH" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=micuadrante \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Subir APK listo para instalar en el movil
        uses: actions/upload-artifact@v4
        with:
          name: Encadenadas-APK-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir AAB FIRMADO para Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Encadenadas-GooglePlay-AAB-FIRMADO
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Subir Certificado PEM para actualizar clave en Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Certificado-PEM-GooglePlay
          path: upload_certificate.pem
